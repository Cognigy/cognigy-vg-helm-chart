####################
# Agentic Endpoint #
####################
## FALLBACK for feature-server's dial-time agent routing only. vg-api-server
## now derives and stores a per-application agentic_endpoint_hook from each
## application's own call_hook at save time, so it no longer reads
## AGENTIC_ENDPOINT_BASE_URL at all. This block still matters for an
## agent-targeted application that predates that column (has not been
## re-saved since) — feature-server derives AGENTIC_ENDPOINT_BASE_URL from it
## via the vg.agenticEndpoint.baseUrl helper.
agenticEndpoint:
  ## Appended to the derived host. Must match vg-agentic-endpoint's ingress
  ## routePrefix + wsPath, or the adapter parses no token and refuses the call.
  pathPrefix: /vg/agentic-endpoint/v1
  ## Host override for when the adapter isn't on the API host. Same syntax as
  ## cognigyLogin.baseUrl below — an http(s) URL, not a websocket one, and no
  ## path — e.g. "https://api-dev.cognigy.ai". The scheme is normalized to
  ## ws(s):// and pathPrefix is appended automatically. Empty (the default)
  ## derives the host from cognigyLogin.baseUrl.
  baseUrl: ""
###########################
# VoiceGateway Components #
###########################
jobs:
  image: cognigy.azurecr.io/vg-k8s-tools:3.23.3
api:
  image: cognigy.azurecr.io/vg-api-server:2026.21.0
  imagePullPolicy: Always
  replicaCount: 2
  ## valid choices are debug, info, error, warn
  logLevel:
  port: 3000
  serviceName: api-server
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - api-server
            topologyKey: kubernetes.io/hostname
  nodeSelector: {}
  priorityClassName: ""
  podSecurityContext: {}
  tolerations: []
  ## Prefix used to create some endpoint values [http | https]
  jwtAuth: true
  ## rate limit
  enableDebounceMiddleware: true
  debounceTimeInSeconds: 5
  debounceQuantity: 50
  disableRateLimit: true # enable only on shared environments
  rateLimitMinutes: 4
  rateLimit: 1000
  enablePrepareCognigyData: true
  ## AI Agent v2 save-time handshake. When an application's calling webhook is a
  ## Cognigy VG2 endpoint, api-server handshakes it and, when it targets an AI
  ## Agent v2, writes the applications.agent_reference_id column and derives
  ## and stores a per-application agentic_endpoint_hook webhook (from the
  ## application's own call_hook — same cluster/host, fixed path; no config
  ## needed here). feature-server opens the call against that hook; api-server
  ## never rewrites the stored call_hook itself.
  ## Initial password for the `admin` API user, stored in the vg-api-admin-creds
  ## secret and handed to the migrator as JAMBONES_ADMIN_INITIAL_PASSWORD so the
  ## database and the secret always agree.
  ## Leave empty to generate one on first install. The secret is created once
  ## (helm.sh/resource-policy: keep) and never rotated by an upgrade, so setting
  ## this later has no effect on an existing cluster — change the password
  ## through the API instead.
  adminInitialPassword: ""
  protocol: https
  ## VG Team configuration
  ## This section configures team member emails and email notification settings
  ## For Cognigy-managed environments, override existingSecret to "vg-team-credentials"
  vgTeam:
    enabled: false
    existingSecret: "vg-team-credentials"
    ## Team member configuration
    teamMembers:
      ## Secret key for team member emails (comma-separated list)
      emailsKey: "VG_TEAM_MEMBER_EMAILS"
      ## Secret key for Cognigy managed environment flag
      managedEnvKey: "COGNIGY_MANAGED_ENV"
    ## Email notification SMTP configuration
    emailNotification:
      smtpHost: "email-smtp.eu-central-1.amazonaws.com"
      smtpPort: "587"
      smtpFrom: "noreply@smtp.cognigy.ai"
      ## Secret keys for SMTP credentials
      smtpUsernameKey: "SMTP_USERNAME"
      smtpPasswordKey: "SMTP_PASSWORD"
  ## TEST-ONLY escape hatch for api-server's SSRF guard (ALLOW_PRIVATE_CUSTOM_URLS,
  ## Cognigy/vg-api-server#226). When true, rejectPrivateHost lets custom URLs target
  ## private/internal hosts at ALL guard call sites (application webhooks, custom
  ## speech URLs, bucket endpoints); empty-hostname, obfuscated-IPv4, DNS-failure,
  ## link-local (cloud metadata) and IPv6 checks still fail closed, and api-server
  ## warn-logs every bypass. This MUST NEVER be enabled on production values — it
  ## exists only for ephemeral single-tenant test clusters where the in-cluster
  ## vg-test-harness mock-cognigy webhook is a Kubernetes Service and therefore
  ## always both a ".local" name and a private IP.
  ## null (default) = automatic: off, except on when vgTestHarness.enabled is true
  ## (so the harness autoProvision Job can register its webhook). Set explicitly to
  ## true/false to override the automatic behavior either way.
  allowPrivateCustomUrls: null
  extraEnvVars: []
  resources:
    requests:
      cpu: "0.250"
      memory: 250Mi
    limits:
      cpu: "0.500"
      memory: 500Mi
apiBan:
  enabled: true
  image: cognigy.azurecr.io/api-ban:1.1.0
  imagePullPolicy: IfNotPresent
  endpoint: https://apiban.org/api
  redisSetKey: apiban:ips
  refreshInterval: 3600
  cronjobTtlSecondsAfterFinished: 180
  apiKey:
    key: ""
    ## For existing API Key, the secret must have the following key:
    ## "apiKey": Containing API Key of API Ban
    ## NOTE: When apiKey.existingKey is set, the values in the previous parameter "apiKey.key" is ignored.
    existingKey: ""
  ## Add a list of known CIDRs to be banned, e.g.: "192.255.255.255/12, 168.255.255.255/24"
  bannedIpsList: ""
  cronjobSchedule: "0 * * * *"
  extraEnvVars: []
## Temporary (Redis TTL-backed) per-IP bans for rejected-request floods, distinct from the
## permanent apiBan blocklist above. sbc-inbound (INVITE) and sbc-sip-sidecar (REGISTER) share
## the same VG_REDIS_BAN_* env var names/semantics, so each gets its own threshold/window/duration
## here even though the defaults currently match. drachtio's separate raw-REGISTER-volume guard
## is intentionally not unified with these and is configured under `drachtio.*` instead.
tmpban:
  invite:
    ## Rejected INVITEs (no matching account/carrier) before banning the source IP.
    banThreshold: 5
    ## Sliding window (minutes) the rejection counter above is tracked over.
    trackingWindowMinutes: 15
    ## Ban duration (hours) applied once banThreshold is reached.
    banDurationHours: 1
  register:
    ## Rejected REGISTERs (no realm / deactivated account / failed auth) before banning the source IP.
    banThreshold: 5
    ## Sliding window (minutes) the rejection counter above is tracked over.
    trackingWindowMinutes: 15
    ## Ban duration (hours) applied once banThreshold is reached.
    banDurationHours: 1
drachtio:
  image: cognigy.azurecr.io/vg-drachtio:1.3.9
  imagePullPolicy: IfNotPresent
  host: 127.0.0.1
  port: 9022
  metricsPort: 8088
  homerId: 10
  ## TLS Configuration for SIP over TLS (SIPS) and WebSocket Secure (WSS)
  tls:
    ## Enable or disable TLS support (ports 5061 and 8443)
    enabled: true
    ## Certificate paths (mounted from cognigy-traefik secret)
    certFile: /etc/letsencrypt/tls.crt
    keyFile: /etc/letsencrypt/tls.key
    chainFile: /etc/letsencrypt/tls.crt
  supportBestEffortTls: false
  rejectRegisterWithNoRealm: true
  ## Bans a source IP once it sends this many raw REGISTERs within registerSpamWindowSecs,
  ## counted before any realm/account check. 0 disables the feature. Known carrier gateway
  ## IPs (sip_gateways) are never banned regardless of this threshold.
  registerSpamThreshold: 10
  ## Rolling window (seconds) the REGISTER-spam counter above is tracked over.
  registerSpamWindowSecs: 60
  ## Ban duration (seconds) applied once registerSpamThreshold is reached.
  registerSpamTtlSecs: 3600
  ## if true - do not advertise public IPs
  privateIpOnly: false
  extraEnvVars: []
  ## feature-server drachtio log level
  ## valid choices are debug, info, notice, error, warning
  logLevel:
  resources:
    requests:
      cpu: "0.5"
      memory: 500Mi
    limits:
      cpu: "0.5"
      memory: 500Mi
featureServer:
  image: cognigy.azurecr.io/vg-feature-server:2026.21.0
  imagePullPolicy: Always
  replicaCount: 2
  ## valid choices are debug, info, error, warn
  logLevel:
  ## 0 - fatal errors, panic
  ## 1 - critical errors, minimal progress at subsystem level
  ## 2 - non-critical errors
  ## 3 - warnings, progress messages
  ## 5 - signaling protocol actions (incoming packets, ...)
  ## 7 - media protocol actions (incoming packets, ...)
  ## 9 - entering/exiting functions, very verbatim progress
  sofiaLoglevel: "3"
  ## Microsoft only - Trims trailing silence (zero-amplitude samples) from the end of an audio file
  trimTts: true
  serviceName: feature-server
  ## AI Agent v2 call routing. When an application's Cognigy endpoint targets an
  ## AI Agent v2 — the applications.agent_reference_id column, written by
  ## vg-api-server's save-time VG2 handshake — feature-server opens the call
  ## against the application's own agentic_endpoint_hook (also written by that
  ## handshake) instead of the Cognigy endpoint. Decided per call; the stored
  ## call_hook is never rewritten. The top-level agenticEndpoint block only
  ## still matters as a fallback for an agent-targeted application that
  ## predates agentic_endpoint_hook.
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - feature-server
            topologyKey: kubernetes.io/hostname
  nodeSelector: {}
  priorityClassName: ""
  podSecurityContext: {}
  tolerations: []
  sigtermForceCloseTimeoutMs: ""
  terminationGracePeriodSeconds: 300
  ## Set to false to run feature-server as a Deployment instead of a StatefulSet
  ## (faster, non-sequential rolling upgrades). The service is always headless,
  ## so SIP/in-dialog routing resolves to real pod IPs in both modes. The old
  ## "does not work on Azure" caveat came from the Deployment falling back to a
  ## non-headless ClusterIP VIP, which is now fixed. Verified on AWS; expected to
  ## work on Azure (AKS) too — confirm on an AKS cluster before enabling in prod.
  useStatefulSet: true
  headlessServiceName: feature-server-headless
  freeswitchConnection: "127.0.0.1:8021:JambonzR0ck$"
  # Sets the max memory size of V8's old memory section - size in Megabytes
  nodeOptions: "--max-old-space-size=450"
  # Pre cache audio - disabled with 4.97.1 due to possbible audio static
  preCacheAudio: false
  anchorMediaAlways: false
  ## Disable the 'P-Asserted-Identity' header
  disableDialPaiHeader: false
  ## list of comma-separated vendors that should not be pre-cached. Valid values are aws, deepgram, elevenlabs, google, ibm, microsoft, nuance, wellsaid, whisper, playh
  preCacheIgnoreList: "deepgram"
  ## Override global.enableTtsStreaming for this feature-server. When set (true/false), takes precedence
  ## over the global switch. Leave as null to inherit from global.enableTtsStreaming.
  enableTtsStreaming: null
  ## List of vendors that use per-credential TTS streaming control.
  ## Vendors not listed fall back to global enableTtsStreaming behavior.
  ## Use ["*"] for all vendors.
  streamingTtsVendors: ["*"]
  # Canary deployment configuration for A/B testing between main and nightly feature servers
  canary:
    # Enable canary deployment with traffic splitting
    enabled: false
    # Percentage of traffic to route to nightly feature server (0-100)
    # Example: 10 means 10% traffic to nightly, 90% traffic to main
    trafficPercentageToNightly: 0
  mediaProcessor:
    enabled: false
    sttVendors: []
    ttsVendors: []
  extraEnvVars: []
  ports:
    tcp: 3000
    udp: 5060
  resources:
    requests:
      cpu: "1"
      memory: 500Mi
    limits:
      cpu: "1"
      memory: 500Mi
  readinessProbe:
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 6 # ~30s of retries once startupProbe has passed
sileroVad:
  ## Enable vg-silero-vad microservice deployment.
  ## When enabled, feature server receives SILERO_VAD_SERVICE_URL env var
  ## pointing to this service for Plan B audio-fork VAD.
  enabled: false
  image: cognigy.azurecr.io/vg-silero-vad:2026.21.0
  ## Default Always because the default tag is :latest (mutable) — prevents
  ## cached/stale images after upgrades. Override to IfNotPresent when pinning
  ## an immutable tag.
  imagePullPolicy: Always
  replicaCount: 2
  port: 8080
  logLevel: info
  ## Comma-separated list of origins allowed to open WebSocket connections.
  ## "*" allows all origins. Safe default for ClusterIP-only deployments
  ## with no ingress. Bare hostnames and glob patterns are NOT supported —
  ## enumerate each scheme+host[:port] explicitly if tightening.
  allowedOrigins: "*"
  ## Seconds to wait for existing WebSocket connections to close naturally after SIGTERM
  ## before force-closing them. Must be less than terminationGracePeriodSeconds (300 s)
  ## to leave headroom for process cleanup.
  drainTimeoutSeconds: 270
  ## Post-drain cleanup budget: how long to wait for handler goroutines to unwind after
  ## connections are closed.
  shutdownTimeoutSeconds: 30
  maxConcurrentSessions: 200 # 0 disables; saturation triggers WS 1013 + readiness flip
  modelVersionFile: /app/model/silero_vad.version
  pdb:
    enabled: true
    minAvailable: 1 # use one of minAvailable or maxUnavailable
    # maxUnavailable: 1
  networkPolicy:
    enabled: true
    # Pod labels of clients allowed to call silero-vad. The default selects
    # feature-server pods; add others (e.g. test harness) by extending the
    # ingressFrom list.
    ingressFrom:
      - podSelector:
          matchLabels:
            app: feature-server
      - podSelector:
          matchLabels:
            app: feature-server-nightly
      - podSelector:
          matchLabels:
            app: feature-server-legacy
    # When true, also allow Prometheus scraping of /metrics from the
    # monitoring namespace. Leave on unless you scrape via DaemonSet on
    # node-local IPs.
    allowMonitoringScrape: true
