  ## On-demand packet-capture service (see github.com/Cognigy/vg-traffic-sniffer).
  ## Dormant by default: nothing (deployment, service, PVC, RBAC) is created
  ## unless enabled, and even then it idles at 0 replicas until scaled up for a
