rtpEngine:
  image: cognigy.azurecr.io/vg-rtpengine:0.2.0
  imagePullPolicy: IfNotPresent
  # During runtime, the log level can be decreased by sending the signal SIGURS1 to the daemon and can be increased with the signal SIGUSR2
  logLevel: 3
  port: 22222
  ## Firewall-opened UDP range for RTP. Also used by vg-connector and vg-traffic-sniffer.
  startPort: 40000
  endPort: 60000
  homerId: 11
  # Enables rtpengine's --measure-rtp (RTP-stream-observed jitter/loss/MOS,
  # no RTCP from either call leg required) and --mos (CQ=conversational,
  # LQ=listening quality) flags. Off by default -- opt in per environment.
  measureRtp: false
  mos: CQ
  ## Core dumps from the rtpengine daemon. Needs an image built with debug
  ## symbols (Cognigy/vg-rtpengine ships those unstripped, plus gdb).
  coreDumps:
    enabled: false
    ## Where the dump lands inside the container.
    path: /var/cores
    ## "emptyDir" keeps dumps for the pod's lifetime -- enough for the usual
    ## case, where rtpengine crashes and only the container restarts.
    ## "hostPath" keeps them on the node after the pod goes away; you clean up.
    type: emptyDir
    sizeLimit: 4Gi
    hostPath: /var/lib/vg/cores
    ## /proc/sys/kernel/core_pattern is node-wide, so writing it needs a
    ## privileged container. Left false, dumps still happen but follow the
    ## node's own pattern instead of landing in `path`.
    privileged: false
  extraEnvVars: []
  resources:
    requests:
      cpu: "3"
      memory: 1Gi
    limits:
      cpu: "3"
      memory: 1Gi
