# ── Test harness ────────────────────────────────────────────────────────────
# Optional in-cluster test fixtures. Disabled by default. Currently only the
# streaming custom-TTS bridge is wired here; the broader vgTestHarness mock
# stack (mock-cognigy, mock-speech, sip-caller, …) is tracked separately.
vgTestHarness:
  # Master switch for the in-cluster mock test harness (mock-cognigy,
  # mock-speech, sip-caller). Everything under this key renders only when it is
  # true, which is what keeps a production install byte-identical.
  enabled: false
  # Whether the harness intercepts REAL speech-vendor traffic.
  #
  #           ADOPTING THIS WHERE A CERTIFICATE ALREADY EXISTS: the chart takes
  #           ownership of mock-speech-tls / mock-speech-ca. If something else
  #           created them, either let whatever manages them remove them first
  #           (a Flux Kustomization with prune: true does this once the files are
  #           dropped) or set mockSpeech.tls.generate false in the same reconcile.
  #           Helm refuses to adopt a resource it does not own, so this fails the
  #           release rather than doing anything quiet.
  #
  #   none    (default) Nothing is redirected at the infrastructure level. Not
  #           "no mocking": an application on a custom:<name> credential still
  #           reaches mock-speech by the URL stored ON THE CREDENTIAL, which
  #           needs nothing from this chart. That is how the kind gate works.
  #
  #   vendor  VG dials the real vendor hostnames and an in-namespace CoreDNS
  #           rewrites them to mock-speech's TLS listener -- the only mode that
  #           runs each vendor's own client code. Derives test-dns and its
  #           rewrite list, the TLS listener and its certificate, the FreeSWITCH
  #           and api-server dnsConfig, and the CA-trust overlay. Nothing else
  #           to set -- the certificate and test-dns's address are both derived.
  #           See mockSpeech.tls.generate and regionDns.clusterIPBase to override
  #           either.
  speechInterception: none
  # The number manifest: which numbers exist, which fixture answers each, and
  # which TO_NUMBER_* variable the Playwright suite reads it from. Empty (the
  # default) keeps the previous single-number behaviour — autoProvision creates
  # one application for autoProvision.phoneNumber, and mock-cognigy serves
  # whatever is POSTed to /scenario.
  #
  # Non-empty renders the vg-test-harness-numbers ConfigMap and switches both
  # the provision Job and mock-cognigy onto it, so what is provisioned and what
  # answers come from one file rather than from two that can disagree.
  #
  #   numbers:
  #     - name: menu                     # names the application: test-app-menu
  #       number: "+15005550001"
  #       env: TO_NUMBER                 # the variable the specs read it from
  #       fixture: two-level-menu.json   # a key in fixturesConfigMap
  #       default: true                  # carrier fallback app; at most one
  #     - name: dtmf
  #       number: "+15005550002"
  #       env: TO_NUMBER_DTMF
  #       fixture: collect-dtmf-echo.json
  #
  # An entry may also set webhookUrl to override the shared call hook. An entry
  # with no fixture is still provisioned — useful for a transfer target some
  # other fixture dials.
  numbers: []
  # Name of an EXISTING ConfigMap whose keys are the fixture JSON files the
  # manifest names, e.g. created by CI with
  #   kubectl create configmap vg-gate-fixtures --from-file=ci/kind/scenarios/
  # It is projected into the same directory as the manifest, so an entry can
  # name its fixture by filename alone. Fixtures are deliberately not chart
  # values: they are large, generated, and owned by the suite that generates
  # them.
  fixturesConfigMap: ""
  mockCognigy:
    image: cognigydevelopment.azurecr.io/vg-mock-cognigy:main
    # 0 keeps the Deployment but runs no pod. For a namespace that enables the
    # harness for the SPEECH mocks only: its applications call the real AI
    # backend, so mock-cognigy is never dialled, and with autoProvision off
    # nothing runs the provisioner that ships in this image either.
    #
    # Note the coupling this image carries: the provision Job's binary comes from
    # here, not from mockSpeech.image. Whenever autoProvision is enabled, this
    # image and mockSpeech.image must come from the SAME build -- an older
    # provisioner crashloops on flags a newer chart passes, and because nothing
    # else restarts, the namespace reads as healthy while nothing was
    # provisioned.
    replicaCount: 1
    logLevel: info
    resources:
      requests: {cpu: "0.100", memory: 128Mi}
      limits: {cpu: "0.200", memory: 256Mi}
  mockSpeech:
    image: cognigydevelopment.azurecr.io/vg-mock-speech:main
    # Default STT transcript returned for every recognized utterance.
    defaultTranscript: "mock transcript"
    # How TTS answers. Empty (the default) leaves the binary's own default: a
    # 440 Hz tone, which is what every load test and bug reproduction wants —
    # cheap and byte-identical every run.
    #
    # "piper" synthesizes the actual prompt offline instead. Needed only by
    # tests that LISTEN to the bot: the voice regression suite transcribes the
    # call and asserts on the words, and a tone transcribes to nothing. The
    # image must carry the piper binary and a voice model, or mock-speech
    # refuses to start rather than quietly falling back to tones.
    #
    # RAISE resources BELOW when setting this. The defaults are sized for the
    # tone generator; piper is a neural TTS that loads a ~63 MB ONNX model, and
    # at the default 200m CPU it spent 4.6s just loading the voice and then blew
    # its 15s synthesis deadline. mock-speech answers a failed synthesis with a
    # tone and logs tts_fallbacks, so the call still completes and the only
    # symptom is that the bot sounds wrong — or, if the vendor SDK gives up
    # first, silent. Around 500m requested / 2 CPU limit and 1Gi is enough.
    ttsEngine: ""
    # How STT answers. Empty (the default) leaves the binary's own default: the
    # canned defaultTranscript above, which is what every deterministic
    # assertion wants.
    #
    # "whisper" recognises the caller's actual audio with whisper.cpp, bundled in
    # the image alongside piper — the mirror of ttsEngine: piper, and the only
    # way to prove a caller's words survived the call path. "vosk" uses an
    # external Vosk websocket server instead (set voskUrl).
    #
    # An explicitly set transcript still beats the recogniser, so a test that
    # pinned the words keeps asserting on them.
    #
    # RAISE resources when setting this: whisper is a neural model, and the
    # numbers below are sized for returning a fixed string. A recognition that
    # overruns its per-turn timeout falls back to the canned transcript and logs
    # it, so a starved recogniser degrades quietly rather than failing the call.
    sttEngine: ""
    # Which whisper model to run. The image carries two:
    #
    #   /opt/whisper/base.en.bin   ~57 MB, fast, the binary's default
    #   /opt/whisper/small.en.bin  ~180 MB, markedly better on the narrowband
    #                              speech a real call carries, ~3x the compute
    #
    # Every whisper model is trained on 16 kHz wideband audio while a call is
    # 8 kHz, so upsampling leaves the top half of the spectrum empty and short
    # number words are where that shows first. A bigger model mitigates that; it
    # does not remove it.
    #
    # Empty uses the binary's default, /opt/whisper/model.bin (a copy of base.en).
    whisperModel: ""
    # Threads whisper.cpp may use, e.g. 4. Worth raising with small.en, but only
    # as far as the pod's CPU limit — threads contending for one core are slower
    # than one thread. Latency is the thing that matters here: a transcript that
    # is correct but arrives after VG's gather has given up is worth nothing.
    whisperThreads: ""
    # Per-turn recognition timeout, e.g. 45s. Raise it alongside a bigger model.
    # An overrun emits NO transcript rather than a placeholder, so a too-short
    # timeout shows up as a bot that never hears anything.
    whisperTimeout: ""
    # Vosk websocket server for sttEngine: vosk, e.g. ws://vosk-stt:2700.
    voskUrl: ""
    # RMS floor, in PCM16 units, below which an audio window produces no
    # transcript at all. Empty leaves the binary's own behaviour: OFF for canned
    # transcripts, and ON at a calibrated default whenever a recogniser is
    # active.
    #
    # Set this only to tune. Recognising the silence at the start of a call
    # returns nothing, the store falls back to the canned transcript, and the
    # flow then has its answer before the caller has spoken -- which reads as
    # recognition being broken when it is working correctly on the wrong audio.
    # 0 forces the gate off.
    sttSilenceRmsThreshold: ""
    # Optional. Omitted from the args unless set, so the binary's own default
    # applies. debug|info|warn|error.
    logLevel: ""
    ## Second listener on :8443, serving the same routes over TLS. Needed only by
    ## the vendor-hostname route, where FreeSWITCH dials a real vendor hostname
    ## (api.eu.deepgram.com) that a DNS rewrite points here — implied by
    ## speechInterception: vendor, which supplies the rewrites too.
    ##
    ## The certificate covers whichever hostnames that route intercepts, so it
    ## is derived from the same rewrite list rather than configured: see
    ## generate below.
    tls:
      # Implied by speechInterception: vendor. Left here so an install that
      # predates that flag keeps working unchanged -- which is also why setting
      # it ALONE mints nothing: such an install already supplies its own Secret,
      # and a chart that started minting would fail on a resource it cannot
      # adopt. See generate.
      enabled: false
      # Whether the CHART mints the certificate: a CA and a leaf covering every
      # rewritten hostname, generated at install and reused on every upgrade.
      #
      # Only on the vendor route. speechInterception: vendor is what derives the
      # hostname list the leaf has to cover, so it is also what makes minting
      # possible; with tls.enabled alone there is no such list and the Secret
      # must come from outside (ci/kind/values-kind-region.yaml is the one
      # in-repo case).
      #
      # Set false on the vendor route where a run mints its own -- then
      # secretName and caConfigMapName must exist before install, or mock-speech
      # sits Pending on a missing volume.
      generate: true
      secretName: mock-speech-tls
      # CA that signed the leaf, mounted by the trust overlay and by api-server.
      caConfigMapName: mock-speech-ca
    resources:
      requests: {cpu: "0.100", memory: 128Mi}
      limits: {cpu: "0.200", memory: 256Mi}
  # DEPRECATED, superseded by the speech adapter. The region-routing test now
  # asserts on the SNI mock-speech was dialled at (regionDns.rewrites pointing
  # at mock-speech, plus mockSpeech.tls) rather than on which sniffer pod logged
  # a rejected ClientHello — see ci/kind/values-kind-region.yaml.
  #
  # Retained, scaled to zero by that overlay, only for a namespace that still
  # points its own rewrites at these Services. The pin below can never move
  # again: vg-test-harness dc660e2 deleted cmd/mock-deepgram-region and its
  # Dockerfile, so :main is frozen at the last image that was pushed. Prefer the
  # adapter for anything new; nothing in the suites reads these any more.
  mockDeepgramRegion:
    image: cognigydevelopment.azurecr.io/vg-mock-deepgram-region:main
    resources:
      requests: {cpu: "0.100", memory: 64Mi}
      limits: {cpu: "0.200", memory: 128Mi}
  # Dedicated CoreDNS instance scoped to exactly three hostnames
  # (api.deepgram.com, api.eu.deepgram.com, api.au.deepgram.com), used only by
  # the FreeSWITCH pod opted in via dnsConfig — see freeswitch.regionDnsEnabled.
  # Everything else forwards to the cluster's real DNS untouched. This is a
  # narrow, three-hostname exception to the "no CoreDNS" decision recorded in
  # docs/superpowers/specs/2026-06-25-vg-test-harness-integration.md — see
  # docs/superpowers/specs/2026-07-24-deepgram-region-test-design.md for why.
  regionDns:
    # Implied by speechInterception: vendor, which also supplies the rewrites.
    # Set it directly only for the Deepgram region-routing suite, which uses the
    # resolver WITHOUT the TLS listener.
    enabled: false
    image: coredns/coredns:1.11.3
    # Dotted prefix, e.g. "172.20.0", that test-dns's address is derived from
    # when clusterIP is unset -- the last octet comes from the namespace name.
    #
    # Empty is the normal case: the chart reads kube-system/kube-dns and uses
    # its /24, which Kubernetes reserves for pinned addresses and never
    # allocates from dynamically, so it is the emptiest part of the Service
    # CIDR. Set this only to override that, or where the render cannot read the
    # cluster (helm template, or a reconciler without get on kube-system
    # Services) -- both of which fail loudly rather than guessing.
    #
    # Derived, not verified free: Helm cannot list what is taken, so a collision
    # is a rejected Service, i.e. a failed install. Pin clusterIP to resolve one.
    clusterIPBase: ""
    # Static ClusterIP for the test-dns Service, overriding both clusterIPBase
    # and the kube-dns-derived default. Pin one to resolve a collision, or where
    # the address must stay put -- a Service's clusterIP is immutable, so a
    # namespace already running the adapter cannot be moved onto a derived one.
    #
    # An address is unavoidable somewhere in this chain: PodDNSConfig.nameservers
    # takes literal IPs only (they are written verbatim into /etc/resolv.conf),
    # never a Service name -- see freeswitch.regionDnsEnabled.
    clusterIP: ""
    # CoreDNS's `forward` plugin only accepts a literal IP address or a
    # readable file path (see plugin/pkg/parse/host.go, HostPortOrFile) — a
    # hostname like kube-dns.kube-system.svc.cluster.local is rejected and
    # the test-dns pod would CrashLoop at startup. The test-dns pod runs
    # with the default dnsPolicy, so its own /etc/resolv.conf already points
    # at the real cluster DNS — forwarding there is safe and cluster-portable.
    upstream: /etc/resolv.conf
    resources:
      requests: {cpu: "0.050", memory: 32Mi}
      limits: {cpu: "0.100", memory: 64Mi}
    # Hostname -> in-cluster Service rewrites. Each entry takes `name`, `target`,
    # and an optional `type` of "exact" (default) or "regex".
    #
    # regex exists because some vendors' hostname is derived from a CREDENTIAL
    # rather than fixed: the Azure JS Speech SDK builds
    # <region>.tts.speech.microsoft.com from the credential's region, so an exact
    # list silently misses any region nobody thought to add — and a miss is not a
    # failure, it is a call that quietly reaches the real paid vendor. One
    # `(.*)\.tts\.speech\.microsoft\.com` entry covers every region instead.
    #
    # Empty by default, and deliberately so. This is the chart's default values
    # file, which every deployment — production included — layers its own
    # values on top of, so no third-party hostname belongs in it: a default
    # that silently redirects api.deepgram.com is the wrong thing to inherit,
    # however well gated. A run that wants to intercept vendor traffic names
    # the hostnames itself, in its own values file (see
    # ci/kind/values-kind-vendor-speech.yaml).
    #
    # Nothing here renders unless test-dns itself does, and an empty list simply
    # yields a CoreDNS config that forwards everything upstream unchanged.
    #
    # speechInterception: vendor supplies the vendor hostname list from the chart
    # and APPENDS this one to it, rather than being replaced by it.
    rewrites: []
    # Whether the provision Job also creates the labelled eu/us/au deepgram
    # credentials the region-routing regression test resolves. Set false when
    # this CoreDNS instance is being used only to rewrite vendor hostnames for
    # the speech adapter: the rewrites are wanted, the extra credentials (which
    # name real vendor hostnames) are not.
    provisionRegionCredentials: true
  sipCaller:
    image: cognigydevelopment.azurecr.io/vg-sip-caller:main
    ## Scheduling for the caller pod. Both empty by default.
    ## Set affinity to co-locate sip-caller with sbc-sip when the carrier
    ## allow-list is a pod CIDR: sbc-sip runs with hostNetwork, so an INVITE
    ## from another node is SNAT'd to the node address and no longer matches.
    affinity: {}
    nodeSelector: {}
    ## Extra CLI flags appended after --addr/--sbc-host/--sbc-port. Used by
    ## kindsmoke for SIPREC re-offer media activation (--mock-srs-initial-inactive
    ## --mock-srs-auto-activate). Empty by default so shared/manual installs keep
    ## the mock-SRS live sendrecv answer.
    extraArgs: []
    resources:
      requests: {cpu: "0.100", memory: 128Mi}
      limits: {cpu: "0.200", memory: 256Mi}
  minio:
    # Optional S3-compatible endpoint for call-recording scenarios. Off by
    # default; the quality gate does not need it.
    enabled: false
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    resources:
      requests: {cpu: "0.100", memory: 256Mi}
      limits: {cpu: "0.500", memory: 512Mi}
  autoProvision:
    # Post-install Job that idempotently creates a service provider, account,
    # application (webhook -> mock-cognigy) and phone number in the local
    # api-server.
    enabled: false
    # Overrides the provisioned call-hook URL. Empty uses
    # ws://mock-cognigy.<namespace>.svc.cluster.local:8080/voiceGateway.
    # The SCHEME selects the feature-server's requestor — ws:// gives the
    # WsRequestor that production uses, http:// gives HttpRequestor.
    webhookUrl: ""
    adminUser: "admin" # users.name column, NOT an email
    adminPass: "" # plain password — use adminPassSecretRef instead to avoid committing credentials
    adminPassSecretRef: # alternative to adminPass: read password from an existing K8s secret
      name: "" # secret name (e.g. vg-api-cognigy-ai-creds); leave empty to use adminPass
      key: "password" # key inside the secret
    # Value stored on the region-test deepgram credentials (gated by
    # vgTestHarness.regionDns.enabled below, not by this field). Deliberately
    # NOT a real Deepgram API key and never needs to be one: the region test's
    # mock pods abort the TLS handshake before Deepgram's WS upgrade (where a
    # key would be sent as an Authorization header) ever happens. A fixed
    # placeholder is fine — vg-api-server only requires the field non-empty.
    deepgramApiKey: "region-test-placeholder-key-not-real"
    phoneNumber: "+15005550001"
    # Pod CIDR of the cluster — allow-listed as the test carrier's SIP gateway
    # source so sbc-inbound accepts INVITEs from sip-caller pods. Set to the
    # cluster pod network address (e.g. "10.104.0.0" with netmask 16 for a
    # 10.104.0.0/16 pod CIDR). Defaults to 127.0.0.1/32 which fails closed.
    carrierSourceIPv4: ""
    carrierSourceNetmask: 16
    # CGY-34769: provision the labelled mip-in / mip-out deepgram credentials the
    # Deepgram Model Improvement Program tests need. They are identical except for
    # deepgram_improvement_program_opt_in (true / false), and both carry
    # deepgram_stt_uri: mock-speech:8080 with deepgram_stt_use_tls: false so
    # mod_deepgram_transcribe reaches mock-speech over the vendor-native protocol.
    #
    # No infrastructure counterpart, unlike regionDns.enabled: the redirection is
    # on the credential, so this needs no DNS interception, no debug/asan
    # FreeSWITCH build, and mutates nothing namespace-wide. That is why the `mip`
    # suite can share a cluster with any other suite while `region` cannot.
    #
    # REQUIRES `deepgram` to be absent from mediaProcessor.sttVendors. That vendor
    # name routes STT through the gRPC media-processor instead of out of
    # FreeSWITCH, and the media-processor does not carry this decision at all
    # (CGY-34207) — so with it listed the tests would assert on a path the feature
    # under test does not use. Nothing here can enforce that; the suite's tests
    # fail (they observe no vendor-native connection) rather than pass wrongly.
    #
    # Existing credentials are reconciled, not just skipped: the opt-in value is
    # the field under test, so a stale row would make the tests pass or fail for
    # the wrong reason.
    mipTest:
      enabled: false
    recording:
      # When enabled, the provision Job also creates the MinIO bucket, sets
      # record_all_calls + record_format on the account, and adds an
      # s3_compatible bucket_credential pointing at the in-cluster MinIO so
      # call-recording scenarios produce objects in MinIO. Requires
      # minio.enabled: true.
      enabled: false
      endpoint: "http://minio:9000"
      bucket: "recordings"
      accessKey: "minioadmin" # MinIO default root user
      secretKey: "minioadmin" # MinIO default root password
      format: "wav" # wav (recommended, parseable) or mp3
  deepgramBridge:
    # Streaming custom-TTS test fixture. Implements the VoiceGateway streaming
    # custom-TTS contract on its inbound side (POST /v1/speak, Bearer auth) and
    # proxies each request to the real Deepgram /v1/speak API, streaming the WAV
    # response back. Point a custom: speech credential's custom_tts_url at
    #   http://deepgram-bridge.<namespace>.svc.cluster.local:8080/v1/speak
    # HTTP (not HTTPS) is intentional: the runtime call path does not require
    # TLS. The webapp "Test" button WILL fail for this URL — api-server's
    # credential test requires https and rejects .local/private hosts as an
    # SSRF guard. That is expected and does not affect actual calls.
    # See https://github.com/Cognigy/vg-test-harness (cmd/deepgram-bridge).
    enabled: false
    # Pinned to a concrete, immutable tag (no :latest). This is the image built
    # and pushed by the vg-test-harness CI (Cognigy/vg-test-harness#15). Update
    # to a main-built tag once that PR merges.
    image: cognigydevelopment.azurecr.io/vg-deepgram-bridge:feat-custom-streaming-tts-bridge-e9effc9c13a2-1780919449
    imagePullPolicy: Always
    logLevel: info
    # Deepgram API key. Either set deepgramApiKey here (a Secret named
    # "deepgram-bridge" is created for you) OR set existingSecret to the name of
    # a Secret you manage and existingSecretKey to the key within it.
    deepgramApiKey: ""
    existingSecret: ""
    existingSecretKey: apiKey
    # Optional override of the upstream Deepgram endpoint. Empty = public API
    # (https://api.deepgram.com/v1/speak).
    deepgramUrl: ""
    resources:
      requests:
        cpu: "0.100"
        memory: 128Mi
      limits:
        cpu: "0.200"
        memory: 256Mi
