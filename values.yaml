freeswitch:
  image: cognigy.azurecr.io/vg-freeswitch:2026.21.0
  imagePullPolicy: IfNotPresent
  ## FreeSWITCH log level. Valid choices (case-insensitive) are the FreeSWITCH log
  ## levels, from least to most verbose:
  ##   disable, console, alert, crit, err, warning, notice, info, debug
  ## The numeric equivalents 0-7 (console=0 … debug=7) are also accepted.
  ## Note these are the syslog-style FreeSWITCH names, not the names the other VG
  ## components use: it is "err" and "warning" here, not "error"/"warn".
  ## The value is passed as "--log-level <level>" to the image entrypoint, which
  ## substitutes it into the loglevel param of switch.conf.xml (parsed by
  ## switch_log_str2level in FreeSWITCH's switch_log.c). An unrecognised value is
  ## silently ignored by FreeSWITCH, leaving the image default of notice in place.
  ## Rendered by the feature-server templates rather than carried in freeswitch.args,
  ## so it survives a freeswitch.args override (Helm replaces list values wholesale).
  ## An explicit --log-level inside freeswitch.args still takes precedence. Defaults
  ## to info when unset; it deliberately does not inherit global.logLevel, since that
  ## uses a different set of level names.
  logLevel: info
  username: Cognigy
  metricsPort: 9090
  ports:
    sip: 5080
    tls: 5081
    eventSocket: 8021
  ## Argument "--codec-answer-generous" is commented because we are looking into a DTMF recognition issue using Firefox, in the Interaction Panel Call,
  ## and until we don't have a solution we will force a specific codec for it. Once we have defintive solution, we uncomment this.
  args:
    - --codec-answer-generous
    # - --g711-only OR
    # - --g711-only-alaw-preferred (this is recommended for clusters running in EU)
    # - --rtp-range-start the starting UDP port for RTP traffic
    # - --rtp-range-end the ending UDP port for RTP traffic
  ## Enable core dump creation on crash. Requires the host/node kernel core_pattern
  ## to be set to a path inside /coredumps (e.g., /coredumps/core.%e.%p.%t).
  createCoreFile: true
  tmpCacheAudioFolder: "/tmp/"
  serviceThreads: 1
  bufferSecs: 5
  deepgramSttUseSingleConnection: true
  azureSttUseSingleConnection: false
  # When true (only meaningful alongside vgTestHarness.regionDns.enabled),
  # the freeswitch pod resolves api.deepgram.com / api.eu.deepgram.com /
  # api.au.deepgram.com via the
  # dedicated test-dns CoreDNS instance instead of the cluster's normal DNS —
  # see docs/superpowers/specs/2026-07-24-deepgram-region-test-design.md.
  regionDnsEnabled: false
  ## it is recommended to force HTTP/1 for streaming since there might be some issues with HTTP/2
  disableHttp2ForTtsStreaming: true
  extraEnvVars: []
  resources:
    requests:
      cpu: "2.5"
      memory: 3Gi
    limits:
      cpu: "2.5"
      memory: 3Gi
  ## Liveness probe for the FreeSWITCH sidecar.
  ## Runs `fs_cli status` to round-trip a command through the event socket, so
  ## a frozen/unresponsive FreeSWITCH (event socket open but not processing) is
  ## detected and the pod restarted. A plain TCP probe would not catch this.
  ## Detection window ≈ periodSeconds * failureThreshold.
  livenessProbe:
    enabled: true
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  ## Startup probe gives FreeSWITCH time to boot before liveness kicks in.
  ## With defaults, allows up to periodSeconds * failureThreshold = 150s.
  startupProbe:
    enabled: true
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 30
freeswitchNightly:
  ## You can specify a custom image for the FreeSWITCH in the nightly FeatureServer here
