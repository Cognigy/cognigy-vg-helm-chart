otelCollector:
  enabled: false
  image: cognigy.azurecr.io/vg-otel-collector:2026.8.0
  imagePullPolicy: IfNotPresent
  replicaCount: 1
  affinity: {}
  nodeSelector: {}
  priorityClassName: ""
  podSecurityContext: {}
  tolerations: []
  jaegerEndpoint: "jaeger:4317"
  # Additional OTLP gRPC exporters. Traces go to Jaeger and to every entry here,
  # after the enabled processors have run. Requires redactionProcessor.enabled.
  # Redaction only covers digit patterns: enable spokennumProcessor (spoken
  # numbers -> digits) and vendortransformProcessor (drops raw vendor STT
  # payloads) before sending traces outside the namespace.
  # name: exporter id (otlp/<name>), [A-Za-z0-9_-], not "jaeger", unique
  # endpoint: host:port (required)
  # insecure: plaintext gRPC (default false)
  # config: optional extra otlp exporter settings (headers, retry_on_failure,
  #   sending_queue, compression, tls.ca_file, ...), rendered as-is
  extraOtlpExporters: []
  # extraOtlpExporters:
  #   - name: alloy
  #     endpoint: "cognigy-alloy.monitoring.svc.cluster.local:4317"
  #     insecure: true
  tracing:
    enabled: false
    otelExporterCollectorUrl: "http://otel-collector:4318/v1/traces"
    otelSampleRate: "1.0"
  grpcEnabled: false
  logLevel: "info"
  # Optional batch processor timeout (e.g. "1s"). Omit for default.
  batch:
    timeout: ""
  redactionProcessor:
    enabled: true
    blockedValues:
      - '\b4(?:[0-9] *){11,14}[0-9]\b' # Visa 13 or 16 digits
      - '\b5[1-5](?:[0-9] *){13}[0-9]\b' # Mastercard 16 digits
      - '\b3[47](?:[0-9] *){12}[0-9]\b' # Amex 15 digits
      - '\b6(?:011|5[0-9]{2})(?:[0-9] *){11}[0-9]\b' # Discover 16 digits
    extraBlockedValues: []
  # Vendor transform processor configuration (drops large vendor.evt for certain vendors)
  # Optional: use "targets" (array) to transform multiple span attributes (e.g. stt.result, http.body).
  # When targets is set, sourceAttribute, vendor_key, default_rule, and rules below are ignored.
  vendortransformProcessor:
    enabled: false
    log_level: ""
    targets:
      - source_attribute: "stt.result"
        default_rule:
          delete_keys: ["vendor.evt.NBest"]
      - source_attribute: "http.body"
        default_rule:
          delete_keys: ["speech.vendor.evt.NBest"]
  # Spoken number to digit conversion processor configuration
  spokennumProcessor:
    enabled: false
    # Supported languages: en, de, es, fr, it, pt, nl
    languages: ["en", "de", "es", "fr", "it", "pt", "nl"]
    # Attribute keys to scan (empty = scan all string attributes)
    attributeKeys: []
    # Minimum consecutive digit words before conversion (avoids false positives)
    minDigitSequence: 4
  resources:
    requests:
      cpu: "100m"
      memory: 256Mi
    limits:
      cpu: "500m"
      memory: 512Mi
