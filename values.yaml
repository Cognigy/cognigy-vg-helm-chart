## MySQL-backed resource resolution gateway, and the acting decision path in
## production: every vg-* service on the call-setup path resolves its tenant data
## here, vg-sbc-inbound's resolveCallAdmission included. It is a critical
## component — while it is unavailable, call admission stops namespace-wide — so
## treat its replica count, resources and rollout the way you would sbc-inbound's.
## Background: vg-resources/docs/tdd/06-vg-in-ai/002-runtime-gateway-migration-plan.md.
resourceResolver:
  enabled: true
  image: cognigy.azurecr.io/vg-resource-resolver:2026.21.0
  imagePullPolicy: IfNotPresent
  ## Two replicas for availability, matching sbcInbound/sbcOutbound. Capacity is
  ## not the reason: a single replica served 600 concurrent calls at 21% of a 250m
  ## limit, p50 7.6ms / p95 10.0ms, with a 98.3% cache hit rate (CGY-36159), and
  ## growth beyond that is handled by the autoscaler, which scales on request rate
  ## at roughly 1200 concurrent. The second replica is redundancy: with one
  ## replica a crash, node failure or eviction stops call admission for every
  ## caller above until the pod reschedules. That window is not acceptable on a
  ## critical-path dependency, and an idle 100m/128Mi pod is cheap next to
  ## rejected INVITEs.
  replicaCount: 2
  ## Anti-affinity, matching sbcInbound. Without it both replicas can land on the
  ## same node, re-introducing exactly the single point of failure the replica
  ## count above exists to remove. Preferred rather than required, so a
  ## single-node cluster still schedules.
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - vg-resource-resolver
            topologyKey: kubernetes.io/hostname
  port: 4000
  ## valid choices are debug, info, error, warn
  logLevel:
  cacheEnabled: true
  cacheTtlSeconds: 60
  ## Linked Cognigy.AI clusters this resolver may resolve runtime resources
  ## against, in the order it tries them. One VG cluster serving several AI
  ## clusters is real in production (11 of 82 clusters, up to 4 each — see
  ## vg-resources docs/tdd/06-vg-in-ai/017), which is why this is a list rather
  ## than the single RUNTIME_API_BASE_URL it replaces.
  ##
  ## `name` must match the key this VG cluster is filed under in the target AI
  ## cluster's trust list (vg-agentic's vgRuntimeApi.auth.clusters) — it becomes
  ## the JWT's `aud`, so a token minted for one AI cluster cannot be replayed to
  ## another. `url` carries no /v1 suffix; the resolver appends it.
  ##
  ## Empty disables the runtime-resources passthrough entirely. Requires
  ## vgCluster below: with no signing key the resolver has no credential to
  ## present and every AI cluster rejects it.
  ##
  ##   runtimeApiTargets:
  ##     - name: ibilousov-test
  ##       url: https://api-ibilousov-test.cognigy.dev/vg/runtime
  ##
  ## MIGRATION: this replaces RUNTIME_API_BASE_URL (and RUNTIME_API_SERVICE_TOKEN),
  ## which this chart never set — the one place it lives today is a fleet repo,
  ## passed through extraEnvVars below. Remove that entry in the same change that
  ## sets this one. The resolver no longer reads it, so a leftover is inert rather
  ## than dangerous; it is just inert config that reads like live config to the
  ## next person debugging the link. Deliberately not a render guard: hard-failing
  ## a reconcile over a variable the consumer ignores costs more than it catches.
  runtimeApiTargets: []
  extraEnvVars: []
  resources:
    requests:
      cpu: "0.100"
      memory: 128Mi
    limits:
      cpu: "0.250"
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  priorityClassName: ""
  podSecurityContext: {}
####################################
# Cross-cluster identity (VG -> AI) #
####################################

## This VG cluster's identity when it calls a linked Cognigy.AI cluster.
##
## vg-resource-resolver signs a short-lived ES256 JWT per outbound call with the
## private key; api-server publishes the public half at /.well-known/jwks.json so
## the AI cluster's vg-runtime-api can verify it and know which VG cluster it is
## talking to. Design: vg-resources
## docs/tdd/06-vg-in-ai/019-vg-resolver-runtime-api-jwt-keypair-auth-proposal.md.
##
## The keypair is generated automatically on first install/upgrade, so a cluster
## picking up this version needs no manual key handling. What stays inert until
## configured is the LINKING: `resourceResolver.runtimeApiTargets` above is empty
## by default, so nothing is called and no credential is presented.
vgCluster:
  ## Stable identifier for this VG cluster. Becomes the JWT's `iss`, and is the
  ## key each linked AI cluster files this cluster under in its trust list.
  ##
  ## Empty falls back to `billing.clusterId`, then to the webapp ingress host —
  ## the same chain api-server already uses for VG_CLUSTER_ID, so a cluster
  ## already has a working identity without anyone setting a new value.
  ##
  ## Setting it explicitly is still worth doing for a cluster that will be
  ## linked: a hostname-derived identity changes if the host ever changes, and
  ## every linked AI cluster's trust list is keyed by this string. Changing it
  ## later means editing each of them.
  name: ""
  signingKey:
    ## Generate the keypair automatically. A `pre-install,pre-upgrade` hook Job
    ## creates it if — and only if — it does not already exist. Modelled on
    ## cognigy-ai-app's own auth-gateway keypair generator.
    ##
    ## The Job never regenerates. That is deliberate: a rotation is a sequenced
    ## operation (publish both keys, wait past the AI side's refresh interval,
    ## then retire the old one — docs/008-vg-cluster-signing-key.md), and doing
    ## it as a side effect of `helm upgrade` would 401 every call this cluster
    ## makes until each linked AI cluster refreshed.
    ##
    ## Its Role grants create + get and deliberately NO update/patch/delete, so
    ## the generator cannot overwrite an existing identity even if the script
    ## were wrong. The Secret is created by kubectl rather than Helm, so it
    ## survives `helm uninstall`.
    autoGenerate: true
    ## Bring your own instead: set this to a Secret you manage (e.g. a
    ## SealedSecret) and the generator Job is not rendered at all. It must hold
    ## both key files named below.
    existingSecret: ""
    ## Key names within that Secret, and what the generator Job writes — so the
    ## two cannot disagree if you change them.
    ##
    ## api-server mounts only the public half and vg-resource-resolver only the
    ## private half. The `items:` selector on each volume is what makes that true:
    ## mount-time isolation, so a compromise of api-server does not expose the
    ## signing key. It is NOT an RBAC boundary — one Secret holds both halves, so
    ## anyone who can read Secrets in this namespace reads both regardless.
    privateKeyFile: "signing-key.pem"
    publicKeyFile: "signing-key.pub.pem"
    ## Needs bash, openssl and kubectl. This is the same image cognigy-ai-app's
    ## keypair generator uses.
    generatorImage: cognigy.azurecr.io/kubectl:latest
sbcInbound:
  image: cognigy.azurecr.io/vg-sbc-inbound:2026.21.0
  imagePullPolicy: IfNotPresent
  replicaCount: 2
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
