  probes:
    startup:
      failureThreshold: 30 # 30 * periodSeconds = 5 minutes max cold start
      periodSeconds: 10
      timeoutSeconds: 5
    liveness:
      initialDelaySeconds: 30 # startupProbe gates this; small floor for clarity
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 2
      successThreshold: 1
  resources:
