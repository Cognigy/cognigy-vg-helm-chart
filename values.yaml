###########
# Traefik #
###########

# The values below are used for Traefik Helm Chart
# For more information, see: https://github.com/traefik/traefik-helm-chart
traefik:
  enabled: true
  global:
    checkNewVersion: false
    sendAnonymousUsage: false
  instanceLabelOverride: "voicegateway"
  fullnameOverride: traefik
  image:
    registry: cognigy.azurecr.io
    repository: traefik
    tag: "3.6.19"
    pullPolicy: IfNotPresent
  deployment:
    ## Specify imagePullSecrets to pull the image from private repository
    ## Based on the information provided in "imageCredentials" parameter previously, this should be either "cognigy-registry-token" or predefined secrets
    ## Note: Can be ignored if traefik is not enabled
    imagePullSecrets:
      - name: cognigy-registry-token
    replicas: 3
    podLabels:
      uniquezone: "set"
  logs:
    general:
      level: INFO
    access:
      enabled: true
      filters: {}
      fields:
        general:
          defaultmode: keep
          names: {}
        headers:
          defaultmode: drop
          names: {}
  api:
    # -- Enable the insecure API (HTTP)
    insecure: true
  ingressClass:
    enabled: true
    isDefaultClass: true
  ingressRoute:
    dashboard:
      enabled: false
  additionalArguments: []
  ports:
    traefik:
      port: 8080
      expose:
        default: false
        internal: false
      exposedPort: 8080
      protocol: TCP
    web:
      port: 8000
      expose:
        default: true
      exposedPort: 80
      protocol: TCP
      ## Note: If traefik is enabled, and tls not, then the auto redirection of http to https also must be disabled
      ## Do that by setting traefik.ports.web.http.redirections: null
      http:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
      # Trust forwarded headers information (X-Forwarded-*).
      forwardedHeaders:
        trustedIPs: []
        insecure: true
      # Enable the Proxy Protocol header parsing for the entry point
      proxyProtocol:
        trustedIPs: []
        insecure: true
    websecure:
      port: 8443
      expose:
        default: true
      exposedPort: 443
      protocol: TCP
      # Trust forwarded  headers information (X-Forwarded-*).
      forwardedHeaders:
        trustedIPs: []
        insecure: true
      # Enable the Proxy Protocol header parsing for the entry point
      proxyProtocol:
        trustedIPs: []
        insecure: true
      http:
        tls:
          enabled: true
          options: ""
          certResolver: ""
          domains: []
    metrics:
      port: 9100
      expose:
        default: false
        internal: true
      exposedPort: 9100
      protocol: TCP
  service:
    enabled: true
    spec: {}
    type: LoadBalancer
    annotations: {}
    annotationsTCP: {}
    annotationsUDP: {}
    labels: {}
    loadBalancerSourceRanges: []
    externalIPs: []
  resources:
    limits:
      cpu: 400m
      memory: 500Mi
    requests:
      cpu: 200m
      memory: 250Mi
  tlsOptions:
    default:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: "uniquezone"
                operator: In
                values:
                  - "set"
          topologyKey: "topology.kubernetes.io/zone"
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
## Optionally create priorityClass
## ref: https://kubernetes.io/docs/concepts/scheduling-eviction/pod-priority-preemption/#priorityclass
##
priorityClass:
  enabled: true
  critical:
    enabled: true
    name: critical
    value: 4000000
    preemptionPolicy: PreemptLowerPriority
    globalDefault: false
    description: "PriorityClass for critical priority services"
  high:
    enabled: true
    name: high
    value: 3000000
    preemptionPolicy: PreemptLowerPriority
    globalDefault: false
    description: "PriorityClass for high priority services"
  medium:
    enabled: true
    name: medium
    value: 2000000
    preemptionPolicy: PreemptLowerPriority
    globalDefault: false
    description: "PriorityClass for medium priority services"
  low:
    enabled: true
    name: low
    value: 1000000
    preemptionPolicy: Never
    globalDefault: false
    description: "PriorityClass for low priority services"
## Optionally enable HorizontalPodAutoscaler for pods
## ref: https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/
##
## Services can render either native HPAs or KEDA ScaledObjects; the latter requires
## hpa.keda.enabled=true (deploys the kedacore/keda subchart) so triggers can query
## their metric sources. Make sure each workload sets requests/limits and that the
## metrics-server or the referenced external metrics backend (for example Prometheus)
## is reachable. The sample service definitions below assume KEDA is managing their
## autoscaling.
##
hpa:
  enabled: false
  ## KEDA (Kubernetes Event-driven Autoscaling). Deploys the KEDA operator via the
  ## kedacore/keda subchart. Required before enabling any hpa.services.<svc>.keda.enabled
  ## (which renders a ScaledObject instead of a native HPA). Mirrors the Cognigy.AI
  ## chart convention. KEDA registers the cluster-wide external.metrics.k8s.io API, so
  ## treat it as a platform component (one per cluster).
  keda:
    enabled: false
  ## When set to true, and "hpa.enabled" is true, the "spec.replicas" field will be omitted from the deployment manifest of all the HPA managed services.
  ##
  removeReplicas: true
  ## Enabling this flag would append the tolerations defined in "hpa.hpaTolerations" to the deployment manifest of all the HPA managed services.
  ##
  useHpaTolerations: true
  ## default tolerations to be added to the deployment manifest of all the HPA managed services.
  ##
  hpaTolerations:
    - key: "node-role.cognigy.ai"
      value: "autoscaler"
      effect: "NoSchedule"
  ## Enabling this flag would append the nodeSelector defined in "hpa.hpaNodeSelector" to the deployment manifest of all the HPA managed services.
  ##
  useHpaNodeSelector: true
  ## default nodeSelector to be added to the deployment manifest of all the HPA managed services.
  ##
  hpaNodeSelector:
    "node-role": "autoscaler"
  ## HorizontalPodAutoscaler (HPA) managed services
  ##
  services:
    featureServer:
      ## Enable horizontal pod autoscaler
      ##
      enabled: true
      name: feature-server
      ## Define the specification of the workload this HAP will manage.
      ## Examples:
      ## If the HPA will manage a Deployment then set the following
      ##  scaleTargetRef:
      ##    apiVersion: apps/v1
      ##    kind: Deployment
      ##
      ## Alternatively if the HPA will manage a StatefulSet then set the following
      ##  scaleTargetRef:
      ##    apiVersion: apps/v1
      ##    kind: StatefulSet
      ##
      scaleTargetRef:
        apiVersion: apps/v1
        kind: StatefulSet
      ## Minimum allowed replicas to which the scaling target can be scaled down
      ##
      minReplicas: 2
      ## Maximum allowed replicas to which the scaling target can be scaled up
      ##
      maxReplicas: 10
      ## KEDA-managed autoscaling (opt-in). Requires hpa.keda.enabled=true.
      ## When enabled, a ScaledObject REPLACES the native HPA above and the triggers
      ## here drive scaling; the behavior above is reused via advanced HPA config.
      ## Example: CPU + calls-per-pod via the existing kube-prometheus-stack.
      keda:
        enabled: true
        triggers:
          - type: cpu
            metricType: Utilization
            metadata:
              value: "50"
          - type: prometheus
            metricType: AverageValue
            metadata:
              serverAddress: http://monitoring-stack-kubeproms-prometheus.monitoring.svc.cluster.local:9090
              query: sum(vg_feature_server_call_session_count{namespace="{{ .Release.Namespace }}",pod!~".*nightly.*"})
              threshold: "120"
      ## Native HPA fallback if keda.enabled is set to false for this service.
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 50
        - type: Pods
          pods:
            metric:
              name: vg_feature_server_call_session_count
            target:
              type: AverageValue
              averageValue: "120"
      ## Fast scale-up (spikes need capacity now); slow, rate-limited scale-down so a
      ## call-bearing pod drains one at a time (pairs with the graceful pre-stop hooks)
      ## and node churn stays low (~1 feature-server pod ≈ 1 node).
      behavior:
        scaleUp: {}
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Pods
              value: 1
              periodSeconds: 120
    ## Opt-in: enable together with featureServerNightly.enabled. Default false so an
    ## HPA/ScaledObject is not rendered against a missing workload.
    featureServerNightly:
      enabled: false
      name: feature-server-nightly
      ## scaleTargetRef.kind is overridden by the template to follow
      ## featureServerNightly.useStatefulSet — see hpa-template.yaml.
      scaleTargetRef:
        apiVersion: apps/v1
        kind: StatefulSet
      minReplicas: 2
      maxReplicas: 10
      keda:
        enabled: true
        triggers:
          - type: cpu
            metricType: Utilization
            metadata:
              value: "50"
          - type: prometheus
            metricType: AverageValue
            metadata:
              serverAddress: http://monitoring-stack-kubeproms-prometheus.monitoring.svc.cluster.local:9090
              query: sum(vg_feature_server_call_session_count{namespace="{{ .Release.Namespace }}",pod=~".*nightly.*"})
              threshold: "120"
      ## Native HPA fallback if keda.enabled is set to false for this service.
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 50
        - type: Pods
          pods:
            metric:
              name: vg_feature_server_call_session_count
            target:
              type: AverageValue
              averageValue: "120"
      ## Same drain-aware scale-down as feature-server — nightly pods carry live calls too.
      behavior:
        scaleUp: {}
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Pods
              value: 1
              periodSeconds: 120
    api:
      enabled: true
      name: api-server
      keda:
        enabled: true
        triggers:
          ## CPU-only: idle Node.js RSS sits above a 50% memory target, which would pin
          ## replicas at max and block scale-down. api-server load is CPU/request-bound.
          - type: cpu
            metricType: Utilization
            metadata:
              value: "50"
      ## Native HPA fallback if keda.enabled is set to false for this service.
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 50
      scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
      minReplicas: 2
      maxReplicas: 10
      behavior: {}
    ## Opt-in: enable together with vgAudioManager.enabled. Default false so a
    ## ScaledObject is not rendered against a missing Deployment.
    vgAudioManager:
      enabled: false
      name: vg-audio-manager
      keda:
        enabled: true
        triggers:
          ## CPU-primary (same shape as api-server). Encoding/upload is CPU-bound;
          ## active WebSocket count is available as vg_audio_manager_active_websocket_connections
          ## if a prometheus trigger is needed later (see sileroVad).
          - type: cpu
            metricType: Utilization
            metadata:
              value: "50"
      ## Native HPA fallback if keda.enabled is set to false for this service.
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 50
      scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
      minReplicas: 2
      maxReplicas: 10
      ## Rate-limit scale-down while recordings are still uploading on draining pods.
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Pods
              value: 1
              periodSeconds: 60
    sbcInbound:
      enabled: true
      name: sbc-inbound
      keda:
        enabled: true
        triggers:
          - type: cpu
            metricType: Utilization
            metadata:
              value: "50"
      ## Native HPA fallback if keda.enabled is set to false for this service.
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 50
      scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
      minReplicas: 2
      maxReplicas: 10
    sbcOutbound:
      enabled: true
      name: sbc-outbound
      keda:
        enabled: true
        triggers:
          - type: cpu
            metricType: Utilization
            metadata:
              value: "50"
      ## Native HPA fallback if keda.enabled is set to false for this service.
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 50
      scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
      minReplicas: 2
      maxReplicas: 10
    # NOTE: the Pods metric "silero_vad_active_sessions" requires
    # prometheus-adapter (or KEDA) to expose the metric via the custom
    # metrics API. If neither is installed, drop the Pods metric or set
    # hpa.services.sileroVad.enabled=false. Verify with:
    #   kubectl get --raw "/apis/custom.metrics.k8s.io/v1beta1/namespaces/<ns>/pods/*/silero_vad_active_sessions"
    sileroVad:
      ## Enable horizontal pod autoscaler for the Silero VAD service.
      ## Silero VAD is CPU-bound (ONNX ML inference per call), making CPU
      ## the primary scaling signal. Each call holds a WebSocket for its
      ## entire duration, so load distributes naturally across pods on new
      ## connections — no sticky sessions are needed.
      enabled: false
      keda:
        enabled: true
        triggers:
          ## Tune after running the VAD benchmark (vg-resources/docs/tdd/03-silero-vad/vad-benchmark-design.md).
          ## 70% leaves headroom before inference latency degrades under contention.
          - type: cpu
            metricType: Utilization
            metadata:
              value: "70"
          - type: memory
            metricType: Utilization
            metadata:
              value: "80"
          - type: prometheus
            metricType: AverageValue
            metadata:
              serverAddress: http://monitoring-stack-kubeproms-prometheus.monitoring.svc.cluster.local:9090
              metricName: silero-vad-active-sessions
              query: sum(silero_vad_active_sessions{namespace="{{ .Release.Namespace }}"})
              threshold: "120"
      ## Native HPA fallback if keda.enabled is set to false for this service.
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              ## Tune after running the VAD benchmark (vg-resources/docs/tdd/03-silero-vad/vad-benchmark-design.md).
              ## 70% leaves headroom before inference latency degrades under contention.
              averageUtilization: 70
        - type: Resource
          resource:
            name: memory
            target:
              type: Utilization
              ## Temporary: gather production baseline data before deciding whether memory
              ## is a meaningful scaling signal. Remove once experience shows it is not needed.
              averageUtilization: 80
        - type: Pods
          pods:
            metric:
              name: silero_vad_active_sessions
            target:
              type: AverageValue
              # Scale up when each pod averages >120 concurrent sessions
              # (60% of the default maxConcurrentSessions=200 cap). Tune
              # together with sileroVad.maxConcurrentSessions.
              averageValue: "120"
      name: silero-vad
      scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
      minReplicas: 2
      maxReplicas: 10
      ## Rate-limit scale-down to 1 pod per 60 s with a 300 s stabilization window.
      ## This aligns with DRAIN_TIMEOUT_SECONDS in the application (vg-silero-vad) to
      ## reduce churn during scale-down while pods are draining active calls. Note: with
      ## periodSeconds: 60 multiple pods may be draining concurrently during large scale-downs.
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Pods
              value: 1
              periodSeconds: 60
    ## vg-resource-resolver — every vg-* service on the call-setup path resolves
    ## its tenant data here, so it is on the critical path for INVITE handling.
    ##
    ## minReplicas 2, matching the other services here, but for availability
    ## rather than capacity.
    ##
    ## Capacity does not require it: a single replica served 600 concurrent calls
    ## at 21% CPU, and the primary trigger below scales out at roughly 1200. The
    ## second replica buys redundancy — with one replica an unplanned pod loss
    ## (crash, node failure, eviction) stops call admission for every vg-* service
    ## until the pod reschedules, and on a critical-path dependency that window is
    ## not acceptable. Two replicas keep INVITE handling alive through the loss of
    ## either one.
    ##
    ## The cost of that redundancy is one extra 100m/128Mi pod per cluster that
    ## enables autoscaling, which is cheap next to rejected INVITEs.
    resourceResolver:
      enabled: true
      name: vg-resource-resolver
      scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
      minReplicas: 2
      maxReplicas: 10
      keda:
        enabled: true
        triggers:
          ## PRIMARY: request rate per pod.
          ##
          ## CPU alone does not work for this service, and that is measured rather
          ## than assumed (CGY-36159, benchmarks/vg-resource-resolver/psouza):
          ## at 200/400/600 concurrent calls it drew 10%/17%/21% of a 250m limit,
          ## so a 50% CPU trigger would not fire until roughly 1500 concurrent —
          ## while the pod was ALREADY throttling on bursts at every one of those
          ## levels. Utilisation understates pressure here. The feature-server
          ## benchmark reached the same conclusion independently and moved to a
          ## calls-per-pod trigger; this mirrors that.
          ##
          ## Threshold 15 req/s per pod. Measured peak was 7.8 req/s at 600
          ## concurrent on one replica, so this scales out at roughly 1200
          ## concurrent — well before the ~2500-3000 the CPU trend extrapolates to.
          ## Deliberately early: an extra replica costs 100m/128Mi, a rejected
          ## INVITE costs a call.
          - type: prometheus
            metricType: AverageValue
            metadata:
              serverAddress: http://monitoring-stack-kubeproms-prometheus.monitoring.svc.cluster.local:9090
              query: sum(rate(vg_resource_resolver_http_requests_total{namespace="{{ .Release.Namespace }}"}[2m]))
              threshold: "15"
          ## BACKSTOP: CPU. Kept so a workload shape we have not measured — heavier
          ## per-request work, a cache-hostile traffic pattern — still scales even
          ## if request rate stays low. Not expected to be the binding trigger.
          - type: cpu
            metricType: Utilization
            metadata:
              value: "70"
      ## Native HPA fallback if keda.enabled is false for this service.
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 70
#######################
# VG Console #
#######################
## Internal console for Voice Gateway clusters
## Provides cluster configuration, DevConfig management, and audit logging
vgConsole:
  ## Enable/disable the VG Console
  enabled: false
  ## Container image
  image: cognigy.azurecr.io/vg-console:2026.1.0
  imagePullPolicy: IfNotPresent
  ## Number of replicas
  replicaCount: 1
  ## Container port
  port: 4000
  ## Log level (uses global.logLevel if not set)
  logLevel:
  database:
    username: vg_console_user
    name: vg_console
    # Password secret configuration
    # If secretName is not set, defaults to voicegateway-mysql-password
    # If secretKey is not set, defaults to mysql-password
    secretName: voicegateway-mysql-password
    secretKey: mysql-password
    # Admin secret for root password (used to create database and user)
    # Root password is stored in mysql-root-password key
    adminSecretName: voicegateway-mysql-password
  resources:
    requests:
      cpu: "0.100"
      memory: 128Mi
    limits:
      cpu: "0.500"
      memory: 512Mi
  ## Node selector
  nodeSelector: {}
  ## Tolerations
  tolerations: []
  ## Affinity
  affinity: {}
  ## Pod security context
  podSecurityContext: {}
  ## Priority class
  priorityClassName: ""
  ## Override URL for vg-pagerduty-agent (cross-namespace or external).
  ## When empty and vgPagerdutyAgent.enabled=true, defaults to same-namespace service.
  pagerdutyAgentUrl: ""
  ## LLM-based enrichment of changelog entries. Requires vgConsole.enabled=true;
  ## the chart will fail template rendering otherwise. When enabled, vg-console
  ## runs an enrichment agent that analyzes the actual PR diff via GitHub and
  ## generates structured signals. Falls back to the deterministic regex
  ## extractor on any failure so ingestion never blocks.
  ##
  ## Two secrets are mounted via envFrom when enabled=true:
  ##
  ##   1. vgPagerdutyAgent.secretName (default "vg-pagerduty-agent-secrets") —
  ##      LLM credentials:
  ##        - LLM_PROVIDER (anthropic | azure-openai | aws-bedrock)
  ##        - AZURE_OPENAI_{ENDPOINT,API_KEY,DEPLOYMENT,API_VERSION}
  ##        - ANTHROPIC_API_KEY
  ##        - AWS_BEDROCK_{REGION,ACCESS_KEY_ID,SECRET_ACCESS_KEY,MODEL}
  ##
  ##   2. githubAppSecretName (default "flux-system-github-app") —
  ##      GitHub App credentials used to fetch PR diffs. Same sealed secret
  ##      Flux uses (keys: githubAppID, githubAppInstallationID,
  ##      githubAppPrivateKey). The agent also accepts the UPPER_SNAKE_CASE
  ##      variants (GITHUB_APP_ID, GITHUB_APP_INSTALLATION_ID,
  ##      GITHUB_APP_PRIVATE_KEY) if supplied via a different secret.
  ##
  ## Both secrets must exist in the target namespace before enabling
  ## changelogEnrichment, otherwise the pod will fail to start.
  changelogEnrichment:
    enabled: false
    ## Name of the secret holding the GitHub App credentials. Defaults to
    ## "flux-system-github-app" which is already present in every cluster
    ## that runs Flux. Override only if you want to use a dedicated secret.
    githubAppSecretName: "flux-system-github-app"
  ## CI service token used to authenticate release-pipeline calls to the
  ## changelog publish endpoints (POST /api/ci/changelog/{sprint}/publish and
  ## PATCH .../patch-status). When vgConsole.enabled=true the chart creates this
  ## secret (templates/common-secrets/vg-console-secret.yaml) with a generated
  ## token (kept across upgrades) and mounts it as VG_CONSOLE_API_TOKEN. Read the
  ## value from the cluster and store it as the VG_CONSOLE_API_TOKEN GitHub
  ## secret in the release repos so CI sends a matching Bearer token. To bring
  ## your own token, pre-create a secret with this name/key before install.
  ciApiToken:
    secretName: "vg-console-secret"
    secretKey: "VG_CONSOLE_API_TOKEN"
  ## Extra environment variables
  extraEnvVars: []
####################################
# VG PagerDuty Agent               #
####################################
## Automated PagerDuty investigation agent with ES, Grafana, and LLM orchestration
vgPagerdutyAgent:
  enabled: false
  image: cognigy.azurecr.io/vg-pagerduty-agent:latest
  imagePullPolicy: IfNotPresent
  replicaCount: 1
  port: 3000
  ## Secret "vg-pagerduty-agent-secrets" must be provisioned externally (e.g. SealedSecret).
  ## Required keys: ELASTICSEARCH_API_KEY_PROD, ELASTICSEARCH_API_KEY_DEV,
  ##   PAGERDUTY_API_KEY, PAGERDUTY_WEBHOOK_SIGNING_SECRET, ANTHROPIC_API_KEY,
  ##   PROM_GRAFANA_API_URL_<ENV>, PROM_GRAFANA_ADMIN_USERNAME_<ENV>, PROM_GRAFANA_ADMIN_PASSWORD_<ENV>
  ##   HYPERCARE_API_TOKEN (required when vgPagerdutyAgent.hypercare.enabled=true)
  ## Hypercare rollback PRs: Azure DevOps Git on flux-fleet-* — ADO_FLUX_FLEET_* from flux-system (default), or add AZURE_DEVOPS_PAT to this secret (vg-console style; see vg-console api/azure-devops-client.js).
  secretName: vg-pagerduty-agent-secrets
  ## Internal URL to vg-console API is derived from vgConsole.port
  consoleServiceName: vg-console
  resources:
    requests:
      cpu: "0.100"
      memory: 128Mi
    limits:
      cpu: "0.500"
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podSecurityContext: {}
  priorityClassName: ""
  extraEnvVars: []
  ## Hypercare monitoring after a release upgrade.
  ##
  ## Central cluster (hypercare.enabled: true):
  ##   Deploys the CronJob that polls /api/hypercare/run every N minutes.
  ##   No-op when no environment has an active window.
  ##   Expose the agent via ingress (ingress.vgPagerdutyAgent.host)
  ##   and share the HYPERCARE_API_TOKEN secret with calling clusters.
  ##
  ## Per-environment activation (hypercare.activateOnDeploy: true):
  ##   On Helm upgrade, fires a post-upgrade Job that POSTs to the central
  ##   vg-console to activate a hypercare window for this environment.
  ##   The Job is intentionally non-blocking: activation failures log a
  ##   warning and exit 0 so an unrelated vg-console outage cannot fail a
  ##   helm release.
  ##   Does NOT deploy local CronJob or hypercare infra.
  hypercare:
    enabled: false
    ## Cron schedule for the polling CronJob (central cluster only)
    schedule: "*/10 * * * *"
    ## Duration of the hypercare window in hours
    windowHours: 2
    successfulJobsHistoryLimit: 6
    failedJobsHistoryLimit: 3
    ## --- Per-environment remote activation (deploying clusters) ---
    ## When true, a post-upgrade Job calls the central vg-console to activate
    ## hypercare for this environment. Requires centralConsoleUrl (or the
    ## deprecated centralAgentUrl) and localEnvironment.
    activateOnDeploy: false
    ## External URL of the central vg-console API (e.g. https://console.internal.example.com).
    ## Hypercare window state is owned by vg-console; activation POSTs go to
    ## ${centralConsoleUrl}/api/hypercare/activate.
    centralConsoleUrl: ""
    ## Deprecated: External URL of the central vg-pagerduty-agent. Used as a fallback
    ## when centralConsoleUrl is not set. The agent forwards /api/hypercare/activate
    ## to vg-console. Remove once all deploying clusters set centralConsoleUrl.
    centralAgentUrl: ""
    ## This cluster's environment name as known to the agent (e.g. "vg-eu")
    localEnvironment: ""
#######################
# Audit Logging #
#######################
auditLogging:
  enabled: true #default is true
  #######################
  # Audit Logs Cleanup #
  #######################
  cleanup:
    ## Cron schedule for audit logs cleanup (daily at 2 AM)
    schedule: "0 2 * * *"
    ## Time in seconds after finished job to keep for debugging
    ttlSecondsAfterFinished: 180
    ttlDays: 30 #default is 30
