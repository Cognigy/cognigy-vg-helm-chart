  extraEnvVars: []
  shadowModeEnabled: false
  shadowSampleRate: "0.0"
  ## Per-layer production VAD graduation kill-switches (default off).
  ## Each var gates one validated VAD layer onto the LIVE barge-in fork in the
  ## feature-server's resolveProdVadLayers (treats "true"/"1" as on, anything
  ## else as off). Defaulting "false" makes the chart upgrade a no-op — flip
  ## per-cluster to graduate a validated layer. NOTE: also requires per-account
  ## opt-in via the account's sileroVad.graduation config; the cluster flag is
  ## necessary but not sufficient on its own. Rendered verbatim as feature-server
  ## env vars (gated by sileroVad.enabled), so the YAML keys ARE the env names.
  prodGraduationEnv:
    SILERO_PROD_AEC_ENABLED: "false"
    SILERO_PROD_NS_ENABLED: "false"
    SILERO_PROD_ENERGY_GATE_ENABLED: "false"
    SILERO_PROD_MIN_SPEECH_FRAMES_ENABLED: "false"
    SILERO_PROD_THRESHOLD_ENABLED: "false"
  mysql:
    enabled: true
    # host/database/user/secretName/secretKey default to the root mysql.* values when unset
    host: ""
    database: ""
    user: ""
    secretName: ""
    secretKey: ""
## vg-vad-autotuner: short-lived CronJob that closes the Silero VAD tuning loop.
## Reads shadow-mode false-fire / miss rates from Prometheus, computes a
## guardrailed per-account endpointing threshold, and writes it back to the
## jambones MySQL DB. Disabled by default — opt in per cluster.
vadAutotuner:
  enabled: false
  image: cognigy.azurecr.io/vg-vad-autotuner:2026.21.0-67
  ## Default Always because the default tag may be mutable — prevents
  ## cached/stale images after upgrades. Override to IfNotPresent when pinning
  ## an immutable tag.
  imagePullPolicy: Always
  ## Cron schedule (UTC). Offset from other nightly jobs to avoid contention.
  schedule: "17 3 * * *"
  ## Reap finished Job/Pod 10 min after completion so a scrape of the
  ## CronJob's own short lifetime has a chance to land before GC.
  ttlSecondsAfterFinished: 600
  ## Prometheus query endpoint used to read shadow FF/miss rates.
  prometheusUrl: "http://prometheus-server.monitoring.svc.cluster.local"
  ## Pushgateway endpoint for autotuner run metrics. A CronJob lives too
  ## briefly to be reliably scraped, so it pushes terminal metrics here.
  pushgatewayUrl: "http://pushgateway.monitoring.svc.cluster.local:9091"
  ## Lookback window for the FF/miss PromQL queries.
  window: "24h"
  ## When "true", compute and log the proposed threshold but do NOT write to
  ## the DB. Keep "true" for at least one full window when first rolling out.
  dryRun: "true"
  ## Minimum gathers per account in the window before a threshold is trusted.
  minGathers: "200"
  ## Hard ceiling on shadow miss rate; above this the account is skipped.
  missCeiling: "0.05"
  ## Target shadow false-fire rate the controller drives each account toward.
  targetFF: "0.03"
  mysql:
    enabled: true
    # host/database/user/secretName/secretKey default to the root mysql.* values when unset
    host: ""
    database: ""
    user: ""
    secretName: ""
    secretKey: ""
