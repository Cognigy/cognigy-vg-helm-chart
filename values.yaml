###########
# General #
###########

global:
  ## Indication that is a Kubernetes deployment
  k8s: true
  ## Node environment
  nodeEnv: ""
  ## Default local host IP
  localhost: 127.0.0.1
  ## Tracking active sessions based on application
  callCounter:
    enabled: true
    # TTL of a call counter session in minutes
    ttlInMinutes: 5
    # Update active sessions of an account every minute, in case calls sessions were expired
    reconcileIntervalSeconds: 60
    # Interval of the leader election in seconds
    leaderElectionIntervalSeconds: 60
  ## private network - IPs of the SBC (e.g. '172.31.0.0/16')
  privateVoipNetworkCidr: ""
  ## Global Docker image registry for Cognigy images
  ##
  imageRegistry: ""
  ## Global Log Level valid choices are debug, error, info, warn (sbc.sip: warning)
  logLevel: info
  enableTtsStreaming: true
  ## Genesys AudioHook integration master switch. One flag fans out to vg-connector,
  ## vg-api-server, and vg-webapp so an operator flips it once per environment
  ## rather than three times. Default false — clusters where AudioHook isn't
  ## deployed or wanted stay dark. NB: this is NOT "Genesys generally" — a
  ## customer can already use Genesys as a SIP-trunk carrier without this flag;
  ## the flag specifically gates the in-cluster AudioHook bridge (vg-connector's
  ## Genesys router + vg-api-server's vendor_integrations CRUD + vg-webapp's
  ## Genesys AudioHook UI).
  enableGenesysAudioHook: false
  ## MS Teams integration master switch. Mirrors enableGenesysAudioHook — one
  ## flag flipped per environment that the vg-connector reads as
  ## ENABLE_MICROSOFT_TEAMS to mount the Teams module. Default false.
  enableMsTeams: false
  ## Reloadable config master switch (see docs/plans/012-reloadable-config-api-server-pilot.md
  ## in vg-resources). Delivers COGNIGY_AI_VERSION, COGNIGY_DISPLAY_VERSION, and
  ## K8S_FEATURE_SERVER_CANARY_ENABLED/_PERCENTAGE via a mounted ConfigMap
  ## instead of literal pod-spec env vars, so a chart bump or canary ramp no
  ## longer restarts every workload. Default false. Enable only once every
  ## consuming service reads from /config/env/cognigy.yaml.
  reloadableConfig:
    enabled: true
###############
# Cognigy ENV #
###############
cognigyEnv:
  ## Enable Redis Sentinel Mode
  ## Note: Redis HA needs to be enabled to use Redis Sentinel Mode
  FEATURE_REDIS_SENTINEL_MODE_ENABLED: "false"
  ## Redis Sentinel Master Name
  REDIS_SENTINEL_MASTER_NAME: "mymaster"
  ## Redis Sentinel Host
  REDIS_SENTINEL_HOST: "redis-ha-headless"
  ## Redis Sentinel Port
  REDIS_SENTINEL_PORT: "26379"
  ## Transition to upstream package - this is required with v4.89
  JAMBONES_REDIS_SENTINEL_MASTER_NAME: "mymaster"
  ## Comma-seperated list of Redis Sentinels
  JAMBONES_REDIS_SENTINELS: "redis-ha-headless:26379"
  ## Enable keep alive for clients created with vg-redis
  REDIS_KEEP_ALIVE_INTERVAL_IN_SECONDS: "10"
  ## DEEPGRAM_IMPROVEMENT_PROGRAM_OPT_OUT (CGY-34204) — set per cluster, no default here.
  ##
  ## Deepgram enrols every account in its Model Improvement Partnership Program by
  ## default, which lets it retain and train on request payloads. Since CGY-34204 the
  ## decision lives on the individual speech credential
  ## (speech_credentials.deepgram_improvement_program_opt_in, chosen in the VG webapp);
  ## this variable is only the *default* for that choice. Set it truthy
  ## (true/yes/on/enabled/1) to have new Deepgram credentials default to opted out, and
  ## to have the api-migrator backfill existing ones on first upgrade.
  ##
  ## Consumed by: api-server + webapp (via the cognigy-env ConfigMap they already mount)
  ## and the api-migrator job (threaded explicitly in templates/api-migrator/job.yaml,
  ## which is not wired to the ConfigMap). Deliberately left unset here — a default
  ## would change the cognigy-env ConfigMap on every cluster and roll every workload
  ## that mounts it, to no effect (unset already means "stay enrolled").
  ## https://developers.deepgram.com/docs/the-deepgram-model-improvement-partnership-program
## Credentials for pulling image from private image registry.
## Ref.: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imageCredentials:
  registry: ""
  username: ""
  password: ""
  ## Alternatively specify an array of imagePullSecrets.
  ## Secrets must be manually created in the proper namespace beforehand.
  ## Example:
  ## pullSecrets:
  ##   - cognigyRegistrySecretName
  ##
  ## Note: When registry, username and password are set, the pullSecrets are ignored.
  pullSecrets: []
## We support the 3 major cloud providers: aws, azure, gcp
## Also supports stackit (STACKIT Cloud - OpenStack-based)
cloud: ""
aws:
  ## Set to true, if using IMDSv2 - Instance Metadata Service Version 2
  useIMDSv2: true
  influxdb:
    storageClassName: "influxdb"
    provisionerName: "ebs.csi.aws.com"
    awsEBSVolumeType: "gp3"
  mysql:
    storageClassName: "mysql"
    provisionerName: "ebs.csi.aws.com"
    awsEBSVolumeType: "gp3"
  postgresql:
    storageClassName: "postgres"
    provisionerName: "ebs.csi.aws.com"
    awsEBSVolumeType: "gp3"
azure:
  useLoadBalancerIMDS: true
  influxdb:
    storageClassName: "influxdb"
    provisionerName: "disk.csi.azure.com"
    azureStorageAccountType: "StandardSSD_LRS"
  mysql:
    storageClassName: "mysql"
    provisionerName: "disk.csi.azure.com"
    azureStorageAccountType: "StandardSSD_LRS"
  postgresql:
    storageClassName: "postgres"
    provisionerName: "disk.csi.azure.com"
    azureStorageAccountType: "StandardSSD_LRS"
gcp:
  influxdb:
    storageClassName: "influxdb"
    provisionerName: "pd.csi.storage.gke.io"
    pdType: "pd-balanced"
  mysql:
    storageClassName: "mysql"
    provisionerName: "pd.csi.storage.gke.io"
    pdType: "pd-balanced"
  postgresql:
    storageClassName: "postgres"
    provisionerName: "pd.csi.storage.gke.io"
    pdType: "pd-balanced"
## STACKIT Cloud (OpenStack-based infrastructure)
## Uses OpenStack Cinder CSI for persistent storage
## Does not use --cloud-deployment flag (relies on SIP_EXTERNAL_IP/RTP_EXTERNAL_IP env vars)
stackit:
  influxdb:
    storageClassName: "influxdb"
    provisionerName: "cinder.csi.openstack.org"
    pdType: "storage_premium_perf6"
  mysql:
    storageClassName: "mysql"
    provisionerName: "cinder.csi.openstack.org"
    pdType: "storage_premium_perf6"
  postgresql:
    storageClassName: "postgres"
    provisionerName: "cinder.csi.openstack.org"
    pdType: "storage_premium_perf6"
stats:
  ## Metrics will be generate
  enabled: true
  ## Connection type
  protocol: tcp
  ## Metrics will be generated in Telegraf format
  telegraf: true
  ## A value from 0 to 1; 1 = send all samples, 0.5 = send every 2nd sample, and so on.
  sampleRate: 1
#######
# TLS #
#######

## Traefik TLS certificate for the hostname defined at ingress.<service_name>.host
## NOTE: If you provide "tls.enable: true" and "traefik.enabled: true", either tls.crt and tls.key or tls.existingSecret must be provided.
tls:
  ## Enable traefik tls
  ## NOTE: If traefik is enabled ("traefik.enabled: true"), and you provide "tls.enable: false", then the auto redirection of http to https
  ## also must be disabled by setting traefik.ports.web.http.redirections: null
  enabled: true
  ## Add Custom CA certificate. A tls type secret named "cognigy-traefik" will be created based on the values of tls.crt and tls.key
  ## Careful with the indentation
  ## For more information, see https://helm.sh/docs/chart_template_guide/yaml_techniques/#strings-in-yaml
  ##
  ## Custom CA certificate in plaintext, not base64 encoded.
  ## Example:
  ##   crt: |
  ##     -----BEGIN CERTIFICATE-----
  ##     -----END CERTIFICATE-----
  crt: ""
  ## CA certificate private key in plaintext, not base64 encoded.
  ## Example:
  ## key: |
  ##   -----BEGIN PRIVATE KEY-----
  ##   -----END PRIVATE KEY-----
  key: ""
  ## Existing secret with TLS certificates. The secret must have the following two keys:
  ## "tls.crt": Containing the CA certificate
  ## "tls.key": Containing the certificate key
  ## NOTE: When tls.existingSecret is set, clear text certificate passed in the previous parameters "tls.crt" and "tls.key" are ignored.
  existingSecret: ""
# Decoding of JWT Interaction Panels calls require the same secret as used in service-api for encoding
# Supports multiple tokens, seperated by ';' secret1;secret2;
cognigyJwtSecrets:
  secret: ""
  secretKey: ""
###########
# Tracing #
###########
tracing:
  enabled: false
  errorsEnabled: false
  baseUrl: ""
  sampleRate: ""
  eventsSampleRate: ""
  environment: ""
###########
# Ingress #
###########

## If ingress is not required to deploy then you can set "ingress.enabled" to false.
## By default it is always enabled.
ingress:
  enabled: true
  ingressClassName: traefik
  api:
    host: ""
    extraAnnotations: {}
    ipWhiteListMiddleware:
      enabled: false
      ipWhiteList:
        sourceRange:
          - 0.0.0.0/0
        ipStrategy:
          depth: 0
  homer:
    enabled: false
    host: ""
    extraAnnotations: {}
    ipWhiteListMiddleware:
      enabled: false
      ipWhiteList:
        sourceRange:
          - 0.0.0.0/0
        ipStrategy:
          depth: 0
  jaeger:
    enabled: false
    host: ""
    extraAnnotations: {}
    basicAuthMiddleware:
      enabled: true
    ipWhiteListMiddleware:
      enabled: false
      ipWhiteList:
        sourceRange:
          - 0.0.0.0/0
        ipStrategy:
          depth: 0
  testCallManager:
    host: ""
    extraAnnotations: {}
    ipWhiteListMiddleware:
      enabled: false
      ipWhiteList:
        sourceRange:
          - 0.0.0.0/0
        ipStrategy:
          depth: 0
  webapp:
    host: ""
    extraAnnotations: {}
    ipWhiteListMiddleware:
      enabled: false
      ipWhiteList:
        sourceRange:
          - 0.0.0.0/0
        ipStrategy:
          depth: 0
  vgConnector:
    host: ""
    extraAnnotations: {}
    ipWhiteListMiddleware:
      enabled: false
      ipWhiteList:
        sourceRange:
          - 0.0.0.0/0
        ipStrategy:
          depth: 0
  vgConsole:
    host: ""
    extraAnnotations: {}
    ipWhiteListMiddleware:
      enabled: false
      ipWhiteList:
        sourceRange:
          - 0.0.0.0/0
        ipStrategy:
          depth: 0
  vgPagerdutyAgent:
    host: ""
    extraAnnotations: {}
    ipWhiteListMiddleware:
      enabled: false
      ipWhiteList:
        sourceRange:
          - 0.0.0.0/0
        ipStrategy:
          depth: 0
#############################
# Shared Speech Credentials #
#############################
sharedSpeechCredentials:
  enabled: false
  ## Enable shared credentials cluster wide for all customers in the cluster
  ## If true, all customers in the cluaster have access to the shared credentials
  ## If false, access to shared credentials should be granted to each customer separately
  clusterWide: false
  existingSecret: "vg-shared-speech-credentials"
  secretKey: "sharedSpeechCredentials"
  label: "NICE_PROVIDED"
  displayNameSuffix: "provided by NiCE"
  microsoftHdVoiceEnabled: false
##################
# Log Redaction  #
##################
# Log redaction for sensitive data (e.g. credit card numbers) in service logs.
# The log-redactor binary is baked into Docker images; this flag activates it
# at runtime via the LOG_REDACTION_ENABLED environment variable.
logRedaction:
  enabled: false
##################
# Speech Billing #
##################
billing:
  enabled: false
  ## Seed test organisations and usage records on deploy. For reviewer testing only — never enable in production.
  seedTestData: false
  ## cluster_host value written into the seeded organisations rows. Must match the value the reporter resolves.
  seedClusterHost: ""
  ## Cluster identifier for billing data (defaults to webapp ingress host if not set)
  # clusterId: ""

  ## Log level for billing jobs
  ## Valid values: debug, info, warn, error
  logLevel:
  mysql:
    database: vg_speech_billing
    ## Dedicated billing user (created by init container)
    username: billing
    existingSecret: vg-billing-mysql-password
    secretKey: billing-password
  ## Refresh-organisations job - keeps the organisations cache warm so the
  ## reporting job's lazy handshake fallback rarely has to run
  refreshOrganisations:
    enabled: true
    ## Schedule: Daily at 01:00 UTC (ahead of pre-aggregation)
    schedule: "0 1 * * *"
  ## Pre-aggregation job - runs daily to calculate 10-minute billing packages
  preAggregation:
    enabled: true
    ## Schedule: Daily at 02:00 UTC
    schedule: "0 2 * * *"
  ## Daily billing reporting job - ships signed tar archives to the Central Billing Server
  sendToCentral:
    enabled: true
    ## Schedule: Daily at 03:00 UTC (after pre-aggregation)
    schedule: "0 3 * * *"
    ## Central Billing Server multipart POST endpoint (required if enabled)
    serverUrl: ""
    ## How many days behind today to set the reporting cutoff (default 2 — ensures
    ## late-arriving call records are included before the day is shipped)
    reportingLagDays: 2
    ## Path to PEM-encoded ED25519 private key file inside the container.
    ## Leave empty to use the dev fallback key (CBS will reject archives in production).
    privateKeyPath: ""
nice:
  ## SIP header used to propagate the carrier's `nice_business_unit` (composite value `bu:<BU>~sid:<call_sid>`).
  ## opt-in. Only attached to inbound 200 OK and outbound INVITE when the carrier has a value.
  ## Empty string disables the header. Header is write-protected: caller-supplied values are stripped.
  sipHeaderCognigyContactData: "X-Cognigy-ContactData"
#############
# SIP & RTP #
#############

## These values route which nodepool the SBC SIP and RTP pods will be placed in.
## The pods have to be in special nodepools that use host network binding due to the nature
## of sip signaling and the current lack of support for the SIP Protocol in Tngress Controllers.
##
## Note: If you want to put SIP and RTP into a single nodepool (e.g.: to save cost on a smaller deployment),
## then set both labels below to the same value and both tolerations below to the same value,
## and use those values when creating your single edge-facing nodepool when you spin up the cluster.
##
# Remark: For production deployments, separate nodepools are recommended for SIP and RTP.
sbc:
  sip:
    ## SAN Multi-Domain certificate or wildcard certificate
    ## Existing secret with TLS certificates. The secret must have the following two keys:
    ## "tls.crt": Containing the CA certificate
    ## "tls.key": Containing the certificate key
    certSecretName: cognigy-traefik
    ## The number of replicas for the RTP pods needs to be the same as the number of static IPs provisioned for the media traffic.
    replicaCount: 2
    ## Please set sbc.rtp.useStatefulSet to false if you don't want to use StatefulSet for SBC RTP (headless service).
    ## Setting it to false is not recommended because the media traffic is often not divided between the pods.
    useStatefulSet: true
    headlessServiceName: sbc-sip-headless
    serviceName: sbc-sip
    useAffinityOnDaemonSet: false
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - sbc-sip
            topologyKey: "kubernetes.io/hostname"
    nodeSelector:
      voip-environment: "edge"
    priorityClassName: ""
    podSecurityContext: {}
    tolerations:
      - key: "voip-edge"
        operator: "Exists"
        effect: "NoSchedule"
    ## sbc-sip drachtio log level
    ## valid choices are debug, info, notice, error, warning
    logLevel: info
    ## 0 - fatal errors, panic
    ## 1 - critical errors, minimal progress at subsystem level
    ## 2 - non-critical errors
    ## 3 - warnings, progress messages
    ## 5 - signaling protocol actions (incoming packets, ...)
    ## 7 - media protocol actions (incoming packets, ...)
    ## 9 - entering/exiting functions, very verbatim progress
    sofiaLoglevel: "3"
    ## if true, all available SBCs will send the REGISTER
    registerAllSbcs: false
    ports:
      tcp: 5060
      tls: 5061
      udp: 5060
      wss: 8443
    ## sip-vg-dev.cognigy.ai
    uri: ""
    ## Explicit SIP contact for drachtio (e.g. "sip:$(POD_IP):5060;transport=udp,tcp").
    ## Empty means let drachtio derive one. Set this on clusters without a cloud
    ## metadata service, where the derived value is the "*" wildcard and
    ## sofia-sip's IPv6-then-IPv4 double bind fails with "Address already in use".
    ## $(POD_IP) is interpolated by Kubernetes and is the node address under
    ## hostNetwork.
    contact: ""
  rtp:
    ## The number of replicas for the RTP pods needs to be the same as the number of static IPs provisioned for the media traffic.
    replicaCount: 2
    ## Please set sbc.rtp.useStatefulSet to false if you don't want to use StatefulSet for SBC RTP (headless service).
    ## Setting it to false is not recommended because the media traffic is often not divided between the pods.
    useStatefulSet: true
    headlessServiceName: sbc-rtp-headless
    serviceName: sbc-rtp
    useAffinityOnDaemonSet: false
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - sbc-rtp
            topologyKey: "kubernetes.io/hostname"
    nodeSelector:
      media-environment: "edge"
    priorityClassName: ""
    podSecurityContext: {}
    tolerations:
      - key: "media-edge"
        operator: "Exists"
        effect: "NoSchedule"
    port: 22222
    ## RTP traffic gate.
    ##
    ## A pod serves RTP unless the Elastic IP it holds is listed in
    ## trafficGate.drainAddresses below. Unset/empty = every pod serves, which is
    ## the behaviour of every release before this key existed.
    trafficGate:
      ## Renders the readinessProbe, the drain-list ConfigMap and its mount.
      ##
      ## OPT-IN, default false. This was default TRUE and unconditional, which
      ## meant every install mounted a gate whose readiness endpoint no released
      ## sidecar image serves, so no sbc-rtp pod ever became Ready:
      ##   Readiness probe failed: Get "http://<ip>:8003/health/ready":
      ##   dial tcp <ip>:8003: connect: connection refused
      ## (ECONNREFUSED, not a 404 — readiness is a separate listener, not a route
      ## on the health server.) The default had to flip for a second reason too:
      ## Helm cannot tell a value the operator set from the chart's own default,
      ## so while the default was true there was no way to express "on here, off
      ## there". Now `enabled: true` means something.
      ##
      ## TURNING THIS ON REQUIRES a vg-sbc-rtpengine-sidecar image that serves
      ## /health/ready on rtpEngineSidecar.ports.readiness. That is
      ## vg-sbc-rtpengine-sidecar#23, STILL OPEN, and the image pinned in
      ## rtpEngineSidecar.image below is NOT one. Enabling this without such an
      ## image wedges sbc-rtp permanently.
      ##
      ## AWS ONLY IN PRODUCTION: the gate decides whether a pod serves by
      ## comparing its own address against the drain list, read from the EC2
      ## instance metadata service (169.254.169.254). drainAddresses enforces that
      ## with a hard failure, so nothing can be drained off AWS whatever this is
      ## set to. Whether the PROBE can pass off AWS while the list is empty is
      ## being tested on kind (ci/kind/values-kind.yaml) — a pod that serves unless
      ## listed may not need its own address at all while nothing is listed.
      ##
      ## ONCE ON, LEAVE IT ON. Toggling changes the pod template and rolls the
      ## StatefulSet; a rolling update waits for each updated pod to become Ready
      ## and a drained pod never does, so a gate that appears and disappears can
      ## WEDGE the rollout. With it steady, every drain is a pure ConfigMap edit
      ## that restarts nothing. Note that turning it OFF cannot wedge anything —
      ## removing a probe makes pods Ready immediately — so recovery is always
      ## available.
      enabled: false
      ## Addresses to take OUT of the media rotation (deny-list).
      ##
      ## Add an address to drain it: new calls stop, in-flight calls finish, and
      ## NO pod restarts — the list reaches running pods via the mounted ConfigMap.
      ## Remove it to restore service. Use for node upgrades, k8s version bumps,
      ## rtpengine rollouts and isolating a misbehaving engine.
      ##
      ## Scaling up needs no entry here: a new pod claims whichever EIP is free and
      ## serves immediately. Keeping a brand-new address out until a customer has
      ## whitelisted it is handled by AWS tag gating, not by this list.
      ##
      ## Propagation: FLUX reconcile (~2m) + ConfigMap sync (up to ~60s) + probe
      ## period + sbc-inbound/outbound DNS poll (10s).
      ##
      ## AWS only: the gate compares against the EC2 IMDS public-ipv4.
      drainAddresses: []
    ## Only rendered while trafficGate.enabled is true.
    readinessProbe:
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      successThreshold: 1
      failureThreshold: 2
  ## EC2 Static EIP Allocator
  ec2EipAllocator:
    ## Only for AWS
    enabled: false
    image: cognigy.azurecr.io/vg-ec2-eip-allocator:2.35.11
    ## Tag key for the SIP EIP Node Pool
    sipEipGroupRoleKey: "role"
    ## Tag value for the SIP EIP Node Pool
    sipEipGroupRole: ""
    ## Tag key for the RTP EIP Node Pool
    rtpEipGroupRoleKey: "role"
    ## Tag value for the RTP EIP Node Pool
    rtpEipGroupRole: ""
    ## User to reallocate static EIPs
    vgOperatorUser: ""
  sipDnsUpdaterAzure:
    ## Only for Azure with private IPs for SIP/RTP Nodes
    enabled: false
    image: cognigy.azurecr.io/vg-sip-dns-updater-azure:1.3.0
    ## Service Principal (SP) with the permissions to update private DNS zone
    ## Provide credentials either via existingSecret or clear text.
    servicePrincipal:
      ## Azure Tenant ID
      tenantId: ""
      ## Application ID of the SP
      appId: ""
      ## Client secret of the SP
      appPassword: ""
      ## Existing secret with SP credentials
      existingSecret: ""
    ## Azure Subscription ID of the Private DNS zone.
    ## If not set, defaults to the first subscription the Service Principal has access to.
    dnsZoneSubscriptionId: ""
    ## Private DNS zone name
    dnsZoneName: ""
    ## Resource Group of the private DNS zone
    dnsZoneRg: ""
    ## TTL of the SIP DNS records
    dnsRecordTtl: "60"
    ## Base name for SIP DNS records
    dnsBaseName: "sbc-sip"
#############
# Databases #
#############
apiMigrator:
  ## Scheduling for the migration Job. Empty means "no constraint", which is what
  ## every existing install gets — see the note in templates/api-migrator/job.yaml
  ## for why they are here at all.
  affinity: {}
  nodeSelector: {}
  hookEnabled: false
  hook: post-install,pre-upgrade
  hookDeletePolicy: before-hook-creation,hook-succeeded
  image: cognigy.azurecr.io/vg-api-migrator:2026.21.0
  imagePullPolicy: Always
  logCollectorEnabled: false
  ## Deploy to latest of a specific release '2025.15.0'
  migrationTarget: "latest"
additionalDbParameters:
  postgresql:
    host: postgres
    port: 5432
influxdb:
  image: cognigy.azurecr.io/vg-influx:1.11.8-alpine
  imagePullPolicy: IfNotPresent
  replicaCount: 1
  affinity: {}
  nodeSelector: {}
  priorityClassName: ""
  ## influxdb >=1.11 runs as non-root uid 1500 (1.8.x ran as root); fsGroup
  ## chowns the data PVC so the new user can write the existing/new volume
  podSecurityContext:
    runAsUser: 1500
    runAsGroup: 1500
    fsGroup: 1500
  tolerations: []
  storage: 20Gi
  storageClassName: influxdb
  logLevel:
  database:
    name: call_counts
  host: influxdb
  port: 8086
  resources:
    requests:
      cpu: "0.500"
      memory: 750Mi
    limits:
      cpu: "1"
      memory: 1.5Gi
## Bitnami Chart, image info: bitnami/mysql:8.0.39-debian-12-r5
mysql:
  enabled: true
  createSecret: true
  global:
    imagePullSecrets:
      - cognigy-registry-token
    storageClass: mysql
  fullnameOverride: mysql
  auth:
    createDatabase: true
    database: jambones
    username: jambones
    existingSecret: voicegateway-mysql-password
  image:
    registry: cognigy.azurecr.io
    repository: mysql
    tag: 8.0.39-debian-12-r5
  primary:
    priorityClassName: ""
    extraFlags: "--max-connections=500"
    persistence:
      size: "10Gi"
    resources:
      requests:
        cpu: "0.500"
        memory: 2Gi
      limits:
        cpu: "0.500"
        memory: 2Gi
  metrics:
    enabled: true
    image:
      registry: cognigy.azurecr.io
      repository: mysqld-exporter
      tag: 0.15.1-debian-12-r34
    resources:
      requests:
        cpu: "0.400"
        memory: 400Mi
      limits:
        cpu: "0.400"
        memory: 400Mi
    serviceMonitor:
      enabled: false
    args:
      # Use the username flag with just the username (no password)
      - --mysqld.username=jambones
      # Use the address flag with host:port
