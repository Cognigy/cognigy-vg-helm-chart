{{- if include "vg.fedramp.callRouterTls" . }}
{{- /*
  CA and server certificate for sbc-call-router (CGY-47751, docs/016-call-router-tls.md), minted once
  and reused (vg.callRouterTls.material). Same idiom as templates/mysql/mysql-tls-secret.yaml.

  Rendered either way, never conditionally omitted: Helm prunes what leaves the manifest, so
  "found it, emit nothing" would delete the Secret.
*/}}
{{- include "vg.callRouterTls.validateImages" . }}
{{- $m := include "vg.callRouterTls.material" . | fromJson }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.sbcCallRouter.tls.secretName }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app: sbc-call-router
    owner-team: echo
  annotations:
    {{- /* Kept on uninstall or when TLS is turned off, so a later enable reuses the same CA. */}}
    "helm.sh/resource-policy": "keep"
type: kubernetes.io/tls
data:
  tls.crt: {{ get $m "tls.crt" }}
  tls.key: {{ get $m "tls.key" }}
  {{- /* Not in the tls Secret contract, but the only way the CA survives a reuse. */}}
  ca.crt: {{ get $m "ca.crt" }}
{{- end }}
