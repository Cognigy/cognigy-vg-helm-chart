{{- if (.Values.podMonitors.enabled) }}
{{- with .Values.podMonitors }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: prom-cognigy-monitor-cognigy-vg-sbc-rtp
  namespace: {{ .namespace }}
  labels:
    owner-team: echo
spec:
  namespaceSelector:
    matchNames:
      - {{ $.Release.Namespace }}
  podMetricsEndpoints:
    ## rtp-engine-sidecar: sbc_rtpengine_stats_* (session accounting)
    - path: /metrics
      port: metrics
    ## rtpengine itself: rtpengine_mos/jitter/packetloss_* — the audio-quality
    ## counters, which live only here and not on the sidecar
    - path: /metrics
      port: rtp-engine
  selector:
    matchLabels:
      app: sbc-rtp
{{- end }}
{{- end }}