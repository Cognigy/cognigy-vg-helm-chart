{{/*
Passwords and ACL file of redis-ha (CSA-100703, docs/013-redis-auth.md).

Minted once and never rotated underneath a running cluster, the idiom of
common-secrets/vg-api-admin-creds.yaml: the lookup guard skips it once it exists, resource-policy:
keep stops Helm from deleting it, and the pre-install/pre-upgrade hook creates it before redis-ha
and the clients that reference it. users.acl is written in the same render as the two passwords, so
the three can never disagree.

Rotation: delete the Secret, reconcile, then restart redis-ha and every Redis client.
*/}}
{{- if include "vg.redisAuth.enabled" . }}
{{- include "vg.redisAuth.validate" . }}
{{- $name := .Values.redisHa.vgAuth.secretName }}
{{- if not (lookup "v1" "Secret" .Release.Namespace $name) }}
{{- $default := randAlphaNum 32 }}
{{- $apiban := randAlphaNum 32 }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    owner-team: echo
  annotations:
    "helm.sh/resource-policy": "keep"
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-5"
type: Opaque
stringData:
  redis-password: {{ $default | quote }}
  apiban-password: {{ $apiban | quote }}
  users.acl: |
    {{- include "vg.redisAuth.aclFile" (dict "default" $default "apiban" $apiban) | nindent 4 }}
{{- end }}
{{- end }}
