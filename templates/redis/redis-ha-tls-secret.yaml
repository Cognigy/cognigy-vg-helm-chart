{{- if include "vg.redisTls.enabled" . }}
{{- include "vg.redisTls.validateServer" . }}
{{- /*
  Certificates for the redis-ha TLS listeners (CGY-42571, CGY-45820, docs/011-redis-tls.md),
  signed once and reused (vg.redisTls.material). Same idiom as
  templates/test-harness/mock-speech-certs.yaml.

  Rendered either way, never conditionally omitted: Helm prunes what leaves the manifest, so
  "found it, emit nothing" would delete them. resource-policy keep (as redis-ha-auth): an
  uninstall, a rollback or turning TLS off leaves them in place, so turning it on again reuses the
  CA instead of rolling every client. Deleting one by hand still rotates it (docs/011).
*/}}
{{- $m := include "vg.redisTls.material" . | fromJson }}
{{- $sn := .Values.redisHa.vgTls.secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $sn }}
  namespace: {{ .Release.Namespace | quote }}
  annotations:
    "helm.sh/resource-policy": keep
    {{- /* The DNS names the certificate was signed for; a change signs it anew (vg.redisTls.materialFor). */}}
    "cognigy.com/dns-names-sha256": {{ get $m "dns-names-sha256" | quote }}
  labels:
    app: redis-ha
    owner-team: echo
type: kubernetes.io/tls
data:
  tls.crt: {{ get $m "tls.crt" }}
  tls.key: {{ get $m "tls.key" }}
  {{- /* Not in the tls Secret contract; Redis verifies client certificates against it. */}}
  ca.crt: {{ get $m "ca.crt" }}
---
{{- /* The CA with its key, to sign certificates on later renders. Mounted nowhere. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-ca" $sn }}
  namespace: {{ .Release.Namespace | quote }}
  annotations:
    "helm.sh/resource-policy": keep
  labels:
    app: redis-ha
    owner-team: echo
type: Opaque
data:
  ca.crt: {{ get $m "ca.crt" }}
  ca.key: {{ get $m "ca.key" }}
---
{{- /* Client certificate of the sbc-sip pod (sbc-sip-sidecar and drachtio). */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-client-sbc-sip" $sn }}
  namespace: {{ .Release.Namespace | quote }}
  annotations:
    "helm.sh/resource-policy": keep
  labels:
    app: sbc-sip
    owner-team: echo
type: kubernetes.io/tls
data:
  tls.crt: {{ get $m "client.crt" }}
  tls.key: {{ get $m "client.key" }}
  ca.crt: {{ get $m "ca.crt" }}
{{- end }}
