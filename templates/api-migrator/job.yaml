apiVersion: batch/v1
kind: Job
metadata:
  name: api-migrator-{{ .Release.Revision }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    owner-team: echo
  annotations:
    "cognigy.com/source-code": "git@github.com:Cognigy/vg-api-server.git"
    {{- if .Values.apiMigrator.hookEnabled }}
    # This is what defines this resource as a hook. Without these lines, the
    # resource is considered part of the release.
    "helm.sh/hook": {{ .Values.apiMigrator.hook | quote }}
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": {{ .Values.apiMigrator.hookDeletePolicy | quote }}
    {{- end }}
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      name: api-migrator
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      {{- include "image.pullSecrets" $ | nindent 6 }}
      restartPolicy: OnFailure
      initContainers:
        # Create billing database, dedicated billing user, and grant privileges using root credentials
        # Tables are created by setup-billing-schema.js in the main container
        - name: create-billing-db
          image: "{{ include "vg.common.image.render" (dict "global" $.Values.global "image" (printf "%s/%s:%s" .Values.mysql.image.registry .Values.mysql.image.repository .Values.mysql.image.tag)) }}"
          imagePullPolicy: {{ .Values.apiMigrator.imagePullPolicy | default "IfNotPresent" }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              echo "Creating vg_speech_billing database..."
              MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -h "$MYSQL_HOST" -u root -e "
                CREATE DATABASE IF NOT EXISTS vg_speech_billing
                  CHARACTER SET utf8mb4
                  COLLATE utf8mb4_unicode_ci;
              "

              echo "Creating dedicated billing user..."
              MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -h "$MYSQL_HOST" -u root -e "
                CREATE USER IF NOT EXISTS '$BILLING_USER'@'%' IDENTIFIED BY '$BILLING_PASSWORD';
                GRANT ALL PRIVILEGES ON vg_speech_billing.* TO '$BILLING_USER'@'%';
                FLUSH PRIVILEGES;
              "

              echo "Granting jambones user full access to vg_speech_billing..."
              MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -h "$MYSQL_HOST" -u root -e "
                GRANT ALL PRIVILEGES ON vg_speech_billing.* TO '$JAMBONES_USER'@'%';
                FLUSH PRIVILEGES;
              "

              # NOTE: the TABLE-level grants on the jambones schema used to live
              # here. They cannot: MySQL rejects a table-level grant on a table
              # that does not exist (ERROR 1146), and on a fresh database those
              # tables do not exist yet — they are created by the migration in
              # this Job's MAIN container, which cannot start until this init
              # container exits 0. With `set -eu` that deadlocked the install.
              # They now live in billing-grants-job.yaml, which runs after the
              # migration and waits for the schema to appear.

              echo "Verifying database exists..."
              MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -h "$MYSQL_HOST" -u root -e "USE vg_speech_billing" || {
                echo "CRITICAL: Failed to verify vg_speech_billing database"
                exit 1
              }

              echo "Billing database and user ready."
          env:
            - name: MYSQL_HOST
              value: {{ .Values.mysql.host | quote }}
            - name: BILLING_USER
              value: {{ .Values.billing.mysql.username | quote }}
            - name: JAMBONES_USER
              value: {{ .Values.mysql.auth.username | quote }}
            - name: BILLING_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.billing.mysql.existingSecret | quote }}
                  key: {{ .Values.billing.mysql.secretKey | quote }}
            - name: JAMBONES_DATABASE
              value: {{ .Values.mysql.database.name | quote }}
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: voicegateway-mysql-password
                  key: mysql-root-password
      containers:
        - name: api-migrator-init
          image: {{ include "vg.common.image.render" (dict "global" $.Values.global "image" .Values.apiMigrator.image) }}
          imagePullPolicy: {{ .Values.apiMigrator.imagePullPolicy }}
          {{- if .Values.billing.enabled }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "=== Running vg migrations ==="
              node /opt/app/build/migrator/migrate.js release

              echo ""
              echo "=== Setting up billing schema ==="
              node /opt/app/build/migrator/setup-billing-schema.js

              if [ "${VG_BILLING_SEED_TEST_DATA}" = "true" ]; then
                echo ""
                echo "=== Seeding billing test data ==="
                node /opt/app/build/migrator/seed-billing-test-data.js
              fi

              echo ""
              echo "=== All migrations complete ==="
          {{- end }}
          env:
            - name: JAMBONES_MYSQL_HOST
              value: {{ .Values.mysql.host | quote }}
            - name: JAMBONES_MYSQL_DATABASE
              value: {{ .Values.mysql.database.name | quote }}
            - name: JAMBONES_MYSQL_USER
              value: {{ .Values.mysql.auth.username | quote }}
            - name: JAMBONES_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: voicegateway-mysql-password
                  key: mysql-password
            # Read from the same secret sbc-inbound and the operator use, so the
            # password in the database and the one in vg-api-admin-creds cannot
            # diverge. Without this the migrator's createAdminUser() falls back
            # to generatePassword(20) and throws the value away, leaving an
            # admin account nobody can authenticate as.
            - name: JAMBONES_ADMIN_INITIAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vg-api-admin-creds
                  key: password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: voicegateway-jwt
                  key: jwt
            - name: JAMBONES_TIME_SERIES_HOST
              value: {{ .Values.influxdb.host }}
            - name: API_MIGRATION_TARGET
              value: {{ .Values.apiMigrator.migrationTarget }}
            {{- if .Values.billing.seedTestData }}
            - name: VG_BILLING_SEED_TEST_DATA
              value: "true"
            - name: VG_BILLING_SEED_CLUSTER_HOST
              value: {{ .Values.billing.seedClusterHost | default "test.billing.local" | quote }}
            {{- end }}
            {{- if .Values.billing.enabled }}
            - name: VG_SPEECH_BILLING_MYSQL_HOST
              value: {{ .Values.mysql.host | quote }}
            - name: VG_SPEECH_BILLING_MYSQL_USER
              value: {{ .Values.billing.mysql.username | quote }}
            - name: VG_SPEECH_BILLING_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.billing.mysql.existingSecret | quote }}
                  key: {{ .Values.billing.mysql.secretKey | quote }}
            {{- end }}
            - name: JAMBONES_DISABLE_TTS_STREAMING
              {{- if kindIs "bool" .Values.featureServer.enableTtsStreaming }}
              value: {{ not .Values.featureServer.enableTtsStreaming | quote }}
              {{- else }}
              value: {{ not .Values.global.enableTtsStreaming | quote }}
              {{- end }}
            ## CGY-34204: seeds the one-time backfill of
            ## speech_credentials.deepgram_improvement_program_opt_in in migration 000041,
            ## so clusters that opted out of Deepgram's Model Improvement Partnership
            ## Program keep that setting once the decision moves onto the credential.
            ##
            ## Threaded from cognigyEnv rather than mounted via `envFrom: cognigy-env`
            ## (as api-server and webapp do) on purpose: with apiMigrator.hookEnabled this
            ## Job runs as a pre-upgrade hook at weight -1, while the cognigy-env ConfigMap
            ## is an ordinary resource — it may not exist yet on a fresh install, and on an
            ## upgrade it still holds the previous revision's values.
            - name: DEEPGRAM_IMPROVEMENT_PROGRAM_OPT_OUT
              value: {{ .Values.cognigyEnv.DEEPGRAM_IMPROVEMENT_PROGRAM_OPT_OUT | default "false" | quote }}
            {{- if .Values.apiMigrator.extraEnvVars }}
            {{- include "vg.common.tplvalues.render" (dict "value" .Values.apiMigrator.extraEnvVars "context" $) | nindent 12 }}
            {{- end }}
        {{- if .Values.apiMigrator.logCollectorEnabled }}
        - name: log-collector
          image: fluentd
          imagePullPolicy: {{ .Values.apiMigrator.imagePullPolicy }}
        {{- end }}