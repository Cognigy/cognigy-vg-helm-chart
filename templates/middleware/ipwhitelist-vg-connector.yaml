{{/* No extraAnnotations here: vgConnector is a Traefik IngressRoute (see
templates/vg-connector/ingressroute.yaml), which lists this Middleware directly in spec.middlewares
rather than through a router.middlewares annotation, so there is no annotation for an
extraAnnotations value to collide with. */}}
{{- if and (.Values.ingress.enabled) (.Values.vgConnector.enabled) (include "vg.fedramp.ingressIpAllowListEnabled" (dict "service" "vgConnector" "override" .Values.ingress.vgConnector.ipWhiteListMiddleware.enabled "sourceRange" .Values.ingress.vgConnector.ipWhiteListMiddleware.ipWhiteList.sourceRange "skipIngressClassCheck" true "root" $)) }}
{{- with .Values.ingress.vgConnector.ipWhiteListMiddleware }}
---
# By default (ipStrategy.depth: 0, or unset) this checks the connection's own remote address, not
# X-Forwarded-For. See docs/009-fedramp-profile.md for when raising depth to read X-Forwarded-For
# is (and isn't) safe.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ipwhitelistvgconnector
  namespace: {{ $.Release.Namespace | quote }}
spec:
  ipAllowList: {{- toYaml .ipWhiteList | nindent 4 }}
{{- end }}
{{- end }}