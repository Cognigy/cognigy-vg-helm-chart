{{- if and (.Values.ingress.enabled) (include "vg.fedramp.ingressIpAllowListEnabled" (dict "service" "api" "override" .Values.ingress.api.ipWhiteListMiddleware.enabled "sourceRange" .Values.ingress.api.ipWhiteListMiddleware.ipWhiteList.sourceRange "extraAnnotations" .Values.ingress.api.extraAnnotations "root" $)) }}
{{- with .Values.ingress.api.ipWhiteListMiddleware }}
---
# By default (ipStrategy.depth: 0, or unset) this checks the connection's own remote address, not
# X-Forwarded-For. See docs/009-fedramp-profile.md for when raising depth to read X-Forwarded-For
# is (and isn't) safe.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ipwhitelistapiserver
  namespace: {{ $.Release.Namespace | quote }}
spec:
  ipAllowList: {{- toYaml .ipWhiteList | nindent 4 }}
{{- end }}
{{- end }}