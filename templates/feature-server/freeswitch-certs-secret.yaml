{{- if .Values.freeswitch.pregeneratedCerts.enabled }}
{{- /*
FreeSWITCH needs certs/dtls-srtp.pem (core media init) and certs/wss.pem (MSRP init) and,
when they are missing, generates a 4096-bit RSA key for each at startup. The container
filesystem is fresh on every start, so that happened on every start: 2 x 1-4s idle, and far
longer on a CPU-throttled pod, a large and random part of FreeSWITCH's startup time.

Generated here once instead and mounted into the freeswitch container. The key must be
4096 bits: FreeSWITCH regenerates any dtls-srtp.pem with a shorter key
(switch_core_check_dtls_pem), and Sprig's genPrivateKey "rsa" is 4096 bits.

Re-rendering reuses the existing Secret's data via lookup, so an upgrade does not rotate the
key. A render without cluster access (helm template, --dry-run, Argo CD) gets nothing from
lookup and generates a fresh key each time: a permanent diff there, and pods pick up a new key
only on restart (subPath mounts do not refresh). Harmless for a self-signed DTLS cert. One key serves every pod and both files: the certs are
self-signed and only identified by their fingerprint, so nothing needs them to differ.
*/}}
{{- $name := include "vg.freeswitch.certsSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $pem := "" }}
{{- if and $existing $existing.data (hasKey $existing.data "dtls-srtp.pem") }}
{{- $pem = index $existing.data "dtls-srtp.pem" | b64dec }}
{{- else }}
{{- $key := genPrivateKey "rsa" }}
{{- $cert := genSelfSignedCertWithKey "FreeSWITCH" (list) (list) 36500 $key }}
{{- $pem = printf "%s%s" $key $cert.Cert }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app: feature-server
    owner-team: echo
type: Opaque
data:
  dtls-srtp.pem: {{ $pem | b64enc }}
  wss.pem: {{ $pem | b64enc }}
{{- end }}
