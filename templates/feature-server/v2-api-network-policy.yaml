{{- /*
Opt-in. Selecting the feature-server pods with a NetworkPolicy makes every
ingress port default-deny for them, so this policy re-opens ALL other ports to
everyone (explicit ranges around the HTTP port, TCP and UDP) and narrows only
the HTTP port to the ingress controller's namespace and this namespace — the
§7.2 "Exposure" row. SIP, RTP, drachtio/freeswitch control and metrics are
unaffected. SCTP is not used by these pods and is therefore closed.
*/ -}}
{{- if and .Values.featureServer.v2Api.networkPolicy.enabled (include "vg.featureServer.v2Api.active" .) }}
{{- $http := .Values.featureServer.ports.tcp | int }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: feature-server-v2-api
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    owner-team: echo
spec:
  podSelector:
    matchLabels:
      app: feature-server
  policyTypes:
    - Ingress
  ingress:
    - ports:
        {{- if gt $http 1 }}
        - protocol: TCP
          port: 1
          endPort: {{ sub $http 1 }}
        {{- end }}
        - protocol: TCP
          port: {{ add $http 1 }}
          endPort: 65535
        - protocol: UDP
          port: 1
          endPort: 65535
    - from:
        - podSelector: {}
        {{- with .Values.featureServer.v2Api.networkPolicy.ingressControllerNamespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ $http }}
{{- end }}
