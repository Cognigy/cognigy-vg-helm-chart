{{- if and (.Values.ingress.enabled) (.Values.ingress.jaeger.enabled) }}
{{- $ipAllowListEnabled := include "vg.fedramp.ingressIpAllowListEnabled" (dict "service" "jaeger" "override" .Values.ingress.jaeger.ipWhiteListMiddleware.enabled "sourceRange" .Values.ingress.jaeger.ipWhiteListMiddleware.ipWhiteList.sourceRange "extraAnnotations" .Values.ingress.jaeger.extraAnnotations "root" $) }}
{{- $middlewares := list }}
{{- if $ipAllowListEnabled }}
{{- $middlewares = append $middlewares (printf "%s-ipwhitelistjaeger@kubernetescrd" $.Release.Namespace) }}
{{- end }}
{{- if .Values.ingress.jaeger.basicAuthMiddleware.enabled }}
{{- $middlewares = append $middlewares (printf "%s-jaegerauth@kubernetescrd" $.Release.Namespace) }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jaeger
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    owner-team: echo
  annotations:
  {{- if eq .Values.ingress.ingressClassName "traefik" }}
    {{- if .Values.tls.enabled }}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    {{- else }}
    traefik.ingress.kubernetes.io/router.entrypoints: web
    {{- end }}
    {{- if $middlewares }}
    ## Both the IP allow-list and basic-auth middlewares used to write this same annotation key;
    ## whichever rendered second silently won, so the IP allow-list never actually applied while
    ## basicAuthMiddleware (on by default) was also enabled (found fixing VHC-SC7-002, SC-7).
    traefik.ingress.kubernetes.io/router.middlewares: {{ join "," $middlewares }}
    {{- end }}
  {{- end }}
  {{- if .Values.ingress.jaeger.extraAnnotations }}
    {{- include "vg.common.tplvalues.render" (dict "value" .Values.ingress.jaeger.extraAnnotations "context" $) | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.ingressClassName }}
  {{- include "vg.tlsCertificate.secretName.render" $ | nindent 2 }}
  rules:
    - host: {{ .Values.ingress.jaeger.host }}
      http:
        paths:
          - backend:
              service:
                name: jaeger
                port:
                  number: {{ .Values.jaeger.ports.tcp }}
            path: /
            pathType: Prefix
{{- end }}