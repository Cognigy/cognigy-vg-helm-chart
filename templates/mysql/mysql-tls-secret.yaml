{{- if include "vg.mysqlTls.enabled" . }}
{{- include "vg.mysqlTls.validateServer" . }}
{{- /*
  CA and server certificate for MySQL (CGY-47155, docs/012-mysql-tls.md), minted once and reused
  (vg.mysqlTls.material). Same idiom as templates/redis/redis-ha-tls-secret.yaml.

  Rendered either way, never conditionally omitted: Helm prunes what leaves the manifest, so
  "found it, emit nothing" would delete the Secret.
*/}}
{{- $m := include "vg.mysqlTls.material" . | fromJson }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.mysql.vgTls.secretName }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app: mysql
    owner-team: echo
  annotations:
    {{- /* Kept on uninstall or when TLS is turned off, so a later enable reuses the same CA. */}}
    "helm.sh/resource-policy": "keep"
type: kubernetes.io/tls
data:
  tls.crt: {{ get $m "tls.crt" }}
  tls.key: {{ get $m "tls.key" }}
  {{- /* Not in the tls Secret contract, but the only way the CA survives a reuse. */}}
  ca.crt: {{ get $m "ca.crt" }}
{{- end }}
