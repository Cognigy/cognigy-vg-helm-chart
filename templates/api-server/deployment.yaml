{{- $vgTeamSecret := include "common.secretName.render" ( dict "existingSecret" $.Values.api.vgTeam.existingSecret "defaultSecret" "vg-team-credentials") }}
{{- $sharedSpeechCredentialsSecret := include "common.secretName.render" ( dict "existingSecret" $.Values.sharedSpeechCredentials.existingSecret "defaultSecret" "vg-shared-speech-credentials") }}
{{- $vgClusterSigningKeySecret := include "vg.clusterSigningKey.secretName" $ }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    owner-team: echo
  annotations:
    "cognigy.com/source-code": "git@github.com:Cognigy/vg-api-server.git"
    "cognigy.com/source-code.db-create-wait": "empty"
    "cognigy.com/source-code.api-server": "git@github.com:Cognigy/vg-api-server.git"

spec:
  selector:
    matchLabels:
      app: api-server
  {{- if not (and ($.Values.hpa.enabled) ($.Values.hpa.removeReplicas) (dig "api" "enabled" false $.Values.hpa.services)) }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  template:
    metadata:
      labels:
        app: api-server
      annotations:
        {{- with (include "vg.testHarness.caChecksum" $) }}{{- . | nindent 8 }}{{- end }}
        checksum/cognigy-env: {{ include (print $.Template.BasePath "/configurations/cognigy-env.yaml") $ | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/common-secrets/vg-homer-password.yaml") $ | sha256sum }}
        {{- if .Values.api.vgTeam.enabled }}
        checksum/vg-team-credentials: {{ if not (lookup "v1" "Secret" $.Release.Namespace $vgTeamSecret) }}{{ $vgTeamSecret | sha256sum }}{{ else }}{{ toYaml (lookup "v1" "Secret" $.Release.Namespace $vgTeamSecret).data | sha256sum }}{{ end }}
        {{- end }}
        {{- if $.Values.sharedSpeechCredentials.enabled }}
        checksum/sharedSpeechCredentials: {{ if not (lookup "v1" "Secret" $.Release.Namespace $sharedSpeechCredentialsSecret) }}{{ $sharedSpeechCredentialsSecret | sha256sum }}{{ else }}{{ toYaml (lookup "v1" "Secret" $.Release.Namespace $sharedSpeechCredentialsSecret).data | sha256sum }}{{ end }}
        {{- end }}
        {{- if $vgClusterSigningKeySecret }}
        ## Rolls the pod when the signing keypair is rotated. api-server reads the
        ## mounted public key once at boot, so without this a rotation is not
        ## published until something else happens to restart the pod — and the
        ## rotation runbook's "publish both, then wait" step would never complete.
        ## Same lookup idiom as the secrets above: hash the NAME when the secret
        ## does not exist yet so a fresh cluster still renders, and only .data
        ## once it does so label churn does not roll the pod.
        checksum/vg-cluster-signing-key: {{ if not (lookup "v1" "Secret" $.Release.Namespace $vgClusterSigningKeySecret) }}{{ $vgClusterSigningKeySecret | sha256sum }}{{ else }}{{ toYaml (lookup "v1" "Secret" $.Release.Namespace $vgClusterSigningKeySecret).data | sha256sum }}{{ end }}
        {{- end }}
    spec:
      {{- include "image.pullSecrets" $ | nindent 6 }}
      {{- if .Values.api.affinity }}
      affinity: {{- include "vg.common.tplvalues.render" (dict "value" .Values.api.affinity "context" $) | nindent 8 }}
      {{- end }}
      {{- if or (.Values.api.nodeSelector) (and ($.Values.hpa.enabled) ($.Values.hpa.useHpaNodeSelector))}}
      nodeSelector:
        {{- if .Values.api.nodeSelector }}
          {{- include "vg.common.tplvalues.render" (dict "value" .Values.api.nodeSelector "context" $) | nindent 8 }}
        {{- end }}
        {{- if and ($.Values.hpa.enabled) ($.Values.hpa.useHpaNodeSelector) }}
          {{- include "vg.common.tplvalues.render" (dict "value" $.Values.hpa.hpaNodeSelector "context" $) | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- if .Values.api.priorityClassName }}
      priorityClassName: {{ .Values.api.priorityClassName }}
      {{- end }}
      {{- if .Values.api.podSecurityContext }}
      securityContext: {{- include "vg.common.tplvalues.render" (dict "value" .Values.api.podSecurityContext "context" $) | nindent 8 }}
      {{- end }}
      {{- if or (.Values.api.tolerations) (and ($.Values.hpa.enabled) ($.Values.hpa.useHpaTolerations))}}
      tolerations: 
        {{- if or (.Values.api.tolerations) }}
          {{- include "vg.common.tplvalues.render" (dict "value" .Values.api.tolerations "context" $) | nindent 8 }}
        {{- end }}
        {{- if and ($.Values.hpa.enabled) ($.Values.hpa.useHpaTolerations) }}
          {{- include "vg.common.tplvalues.render" (dict "value" $.Values.hpa.hpaTolerations "context" $) | nindent 8 }}
        {{- end }}
      {{- end }}
      restartPolicy: Always
      {{- with (include "vg.testHarness.apiServerDnsConfig" .) }}{{- . | nindent 6 }}{{- end }}
      initContainers:
        - image: kanisterio/mysql-sidecar:0.40.0
          name: db-create-wait
          env:
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: voicegateway-mysql-password
                  key: mysql-password
          command:
            - sh 
            - -c 
            - |
              until mysql -u {{ .Values.mysql.auth.username }} -D {{ .Values.mysql.database.name }} -h {{ .Values.mysql.host }} -p${PASSWORD} --protocol=tcp -e "select count(*) from accounts";
              do 
                sleep 5
              done
      containers:
        - name: api-server
          image: {{ include "vg.common.image.render" (dict "global" $.Values.global "image" .Values.api.image) }}
          imagePullPolicy: {{ .Values.api.imagePullPolicy }}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          ports:
            - name: api-server
              containerPort: {{ .Values.api.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.health.port }}
              protocol: TCP
          {{- if not .Values.api.forDevelopment }}
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: {{ .Values.health.port }}
            failureThreshold: 3
            initialDelaySeconds: 90
            periodSeconds: 60
            timeoutSeconds: 10 
          startupProbe:
            httpGet:
              path: /health/startup
              port: {{ .Values.health.port }}
          {{- end }}
          env:
            {{- with (include "vg.testHarness.apiServerEnv" .) }}{{- . | nindent 12 }}{{- end }}
            - name: NODE_ENV
              value: {{ .Values.global.nodeEnv | quote }}
            - name: HTTP_PORT
              value: {{ .Values.api.port | quote }}
            ## Genesys AudioHook master switch — gates the vendor_integrations
            ## CRUD route mount in lib/routes/api/vendor-integrations.ts.
            - name: ENABLE_GENESYS_AUDIOHOOK
              value: {{ .Values.global.enableGenesysAudioHook | quote }}
            ## MS Teams master switch — same gate, so the vendor_integrations
            ## CRUD route also mounts when only MS Teams (not Genesys) is on.
            - name: ENABLE_MICROSOFT_TEAMS
              value: {{ .Values.global.enableMsTeams | quote }}
            - name: K8S
              value: {{ .Values.global.k8s | quote }}
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_FEATURE_SERVER_SERVICE_NAME
              ## Always the headless service (works for StatefulSet and Deployment)
              value: {{ .Values.featureServer.headlessServiceName | quote }}
            {{- /* Reloadable configs were introduced in v2026.17.0; when global.reloadableConfig.enabled=true, api-server should read canary settings from the mounted ConfigMap. Keep these env vars as a backward-compat fallback and remove once older images are no longer supported. */}}
            {{- if not .Values.global.reloadableConfig.enabled }}
            - name: K8S_FEATURE_SERVER_CANARY_ENABLED
              value: {{ .Values.featureServer.canary.enabled | quote }}
            - name: K8S_FEATURE_SERVER_CANARY_PERCENTAGE
              value: {{ .Values.featureServer.canary.trafficPercentageToNightly | quote }}
            {{- end }}
            - name: HOMER_BASE_URL
              value: {{ .Values.homer.urlPrefixServiceConnection }}{{ .Values.homer.serviceName }}
            - name: HOMER_USERNAME
              value: {{ .Values.homer.auth.username | quote }}
            {{- if .Values.homer.enabled }}
            {{- /*
              Guarded on homer.enabled. The vg-homer-password secret is only
              created when homer is enabled (see
              templates/common-secrets/vg-homer-password.yaml), but this
              reference was unconditional, so with homer.enabled=false the
              api-server pod sat in CreateContainerConfigError with
              `secret "vg-homer-password" not found` and never started — which
              in turn starved everything that depends on api-server.
            */}}
            - name: HOMER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vg-homer-password
                  key: homer-password
            {{- end }}
            - name: JAEGER_BASE_URL
              value: {{ .Values.jaeger.urlPrefixServiceConnection }}{{ .Values.jaeger.serviceName }}:{{ .Values.jaeger.ports.tcp }}
            - name: JAMBONES_AUTH_USE_JWT
              value: {{ .Values.api.jwtAuth | quote }}
            - name: JAMBONES_LOGLEVEL
              value: {{ if .Values.api.logLevel }}{{ .Values.api.logLevel | quote }}{{ else }}{{ .Values.global.logLevel | quote }}{{ end }}
            - name: JAMBONES_MYSQL_HOST
              value: {{ .Values.mysql.host }}
            - name: JAMBONES_MYSQL_DATABASE
              value: {{ .Values.mysql.database.name | quote }}
            - name: JAMBONES_MYSQL_USER
              value: {{ .Values.mysql.auth.username | quote }}
            - name: JAMBONES_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: voicegateway-mysql-password
                  key: mysql-password
            - name: JAMBONES_REDIS_HOST
              value: {{ .Values.redis.host }}
            - name: JAMBONES_REDIS_PORT
              value: {{ .Values.redis.port | quote }}
            {{- with include "vg.redisAuth.clientEnv" $ }}{{ . | nindent 12 }}{{ end }}
            - name: JAMBONES_TIME_SERIES_HOST
              value: {{ .Values.influxdb.host }}
            - name: JAMBONES_TRUST_PROXY
              value: "2"
            - name: SIP_BASE_URL
              value: {{ required "sbc.sip.uri must be set to a non-empty SIP base URL for api-server" .Values.sbc.sip.uri | quote }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: voicegateway-jwt
                  key: jwt
            - name: TRACING_ENABLED
              value: {{ .Values.tracing.enabled | quote }}
            - name: TRACING_BASE_URL_WITH_PROTOCOL
              value: {{ .Values.tracing.baseUrl | quote }}      
            - name: TRACING_ERRORS_ENABLED
              value: {{ .Values.tracing.errorsEnabled | quote }}
            - name: TRACING_SAMPLE_RATE
              value: {{ .Values.tracing.sampleRate | quote }}
            - name: TRACING_EVENTS_SAMPLE_RATE
              value: {{ .Values.tracing.eventsSampleRate | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.tracing.environment | quote }}
            {{- /* Reloadable configs were introduced in v2026.17.0; once this service reads COGNIGY_AI_VERSION from the mounted ConfigMap, this fallback can be removed in a future release. */}}
            {{- if not .Values.global.reloadableConfig.enabled }}
            - name: COGNIGY_AI_VERSION
              value: {{ regexFind "^[0-9]+\\.[0-9]+\\.[0-9]+" .Chart.Version | quote }}
            {{- end }}
            - name: ENABLE_DEBOUNCE_MIDDLEWARE
              value: {{ .Values.api.enableDebounceMiddleware | quote }}
            - name: DEBOUNCE_TIME_IN_SECONDS
              value: {{ .Values.api.debounceTimeInSeconds | quote }}
            - name: DEBOUNCE_QUANTITY
              value: {{ .Values.api.debounceQuantity | quote }}
            - name: DISABLE_RATE_LIMIT
              value: {{ .Values.api.disableRateLimit | quote }}
            - name: RATE_LIMIT_WINDOWS_MINS
              value: {{ .Values.api.rateLimitMinutes | quote }}
            - name: RATE_LIMIT_MAX_PER_WINDOW
              value: {{ .Values.api.rateLimit | quote }}              
            - name: JAMBONZ_RECORD_WS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: voicegateway-call-recording-credentials
                  key: username
            - name: JAMBONZ_RECORD_WS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: voicegateway-call-recording-credentials
                  key: password
            - name: VG_WEBAPP_BASE_URL
              value: {{ printf "%s://%s" .Values.api.protocol .Values.ingress.webapp.host | quote }}
            {{- if .Values.cognigyLogin.enabled }}
            - name: VG_API_BASE_URL
              value: {{ printf "%s://%s" .Values.api.protocol .Values.ingress.api.host | quote }}
            - name: COGNIGY_API_BASE_URL
              value: {{ .Values.cognigyLogin.baseUrl | quote }}
            - name: COGNIGY_OAUTH_CLIENT_ID
              value: {{ .Values.cognigyLogin.clientId | quote }}
            - name: COGNIGY_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cognigyLogin.secret | quote }}
                  key: {{ .Values.cognigyLogin.secretKey | quote }}
            {{- end }}
            - name: ENABLE_PREPARE_COGNIGY_DATA
              value: {{ .Values.api.enablePrepareCognigyData | quote }}
            ## TEST-ONLY SSRF-guard escape hatch — see api.allowPrivateCustomUrls in
            ## values.yaml; must never be enabled on production values. When the key
            ## is left null (default), it follows vgTestHarness.enabled so the harness
            ## autoProvision Job can point the test application's webhook at the
            ## in-cluster mock-cognigy Service. The env var is omitted entirely when
            ## the resulting value is false (guard fully active).
            {{- $allowPrivateCustomUrls := .Values.api.allowPrivateCustomUrls }}
            {{- if kindIs "invalid" $allowPrivateCustomUrls }}
            {{- $allowPrivateCustomUrls = .Values.vgTestHarness.enabled }}
            {{- end }}
            {{- if $allowPrivateCustomUrls }}
            - name: ALLOW_PRIVATE_CUSTOM_URLS
              value: "true"
            {{- end }}
            {{- if .Values.api.vgTeam.enabled }}
            - name: EMAIL_NOTIFICATION_SMTP_HOST
              value: {{ .Values.api.vgTeam.emailNotification.smtpHost | quote }}
            - name: EMAIL_NOTIFICATION_SMTP_PORT
              value: {{ .Values.api.vgTeam.emailNotification.smtpPort | quote }}
            {{- if (lookup "v1" "Secret" $.Release.Namespace $vgTeamSecret) }}
            - name: EMAIL_NOTIFICATION_SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $vgTeamSecret }}
                  key: {{ .Values.api.vgTeam.emailNotification.smtpUsernameKey | quote }}
            - name: EMAIL_NOTIFICATION_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $vgTeamSecret }}
                  key: {{ .Values.api.vgTeam.emailNotification.smtpPasswordKey | quote }}
            {{- end }}
            - name: EMAIL_NOTIFICATION_SMTP_TLS_REQUIRED
              value: "starttls"
            - name: EMAIL_NOTIFICATION_SMTP_FROM
              value: {{ .Values.api.vgTeam.emailNotification.smtpFrom | quote }}
            - name: VG_TEAM_MEMBER_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vg-team-default-password
                  key: defaultUserPassword
            - name: VG_TEAM_MEMBER_EMAILS
              valueFrom:
                secretKeyRef:
                  name: {{ $vgTeamSecret }}
                  key: {{ .Values.api.vgTeam.teamMembers.emailsKey | quote }}
                  optional: true
            - name: COGNIGY_MANAGED_ENV
              valueFrom:
                secretKeyRef:
                  name: {{ $vgTeamSecret }}
                  key: {{ .Values.api.vgTeam.teamMembers.managedEnvKey | quote }}
                  optional: true
            {{- end }}
            {{- with include "vg.fedramp.sessionKeyDigest" (dict "override" .Values.api.sessionKeyDigest "root" $) }}
            - name: SESSION_KEY_DIGEST
              value: {{ . | quote }}
            {{- end }}
            {{- with include "vg.fedramp.auditLogTtlDays" (dict "override" .Values.auditLogging.cleanup.ttlDays "root" $) }}
            - name: AUDIT_LOG_TTL_DAYS
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.api.extraEnvVars }}
            {{- include "vg.common.tplvalues.render" (dict "value" .Values.api.extraEnvVars "context" $) | nindent 12 }}
            {{- end }}
            - name: ENABLE_AUDIT_LOGGING
              value: {{ .Values.auditLogging.enabled | quote }}
            - name: VG_CLUSTER_ID
              value: {{ .Values.billing.clusterId | default .Values.ingress.webapp.host | quote }}
            - name: VG_SPEECH_BILLING_ENABLED
              value: {{ .Values.billing.enabled | quote }}
            {{- if .Values.billing.enabled }}
            - name: VG_SPEECH_BILLING_MYSQL_USER
              value: {{ .Values.billing.mysql.username | quote }}
            - name: VG_SPEECH_BILLING_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.billing.mysql.existingSecret | quote }}
                  key: {{ .Values.billing.mysql.secretKey | quote }}
            {{- end }}
            - name: SYSTEM_SPEECH_CREDENTIAL_LABEL
              value: {{ $.Values.sharedSpeechCredentials.label | quote }}
            - name: FEATURE_ENABLE_SHARED_SPEECH_CREDENTIALS
              value: {{ $.Values.sharedSpeechCredentials.enabled | quote }}
            {{- if $.Values.sharedSpeechCredentials.enabled }}
            - name: ENABLE_CLUSTER_WIDE_SHARED_CREDENTIALS
              value: {{ $.Values.sharedSpeechCredentials.clusterWide | quote }}
            - name: SHARED_SPEECH_CREDENTIALS_MICROSOFT_HD_VOICES_ENABLED
              value: {{ $.Values.sharedSpeechCredentials.microsoftHdVoiceEnabled | quote }}
            - name: VG_SHARED_SPEECH_CREDENTIALS
              valueFrom:
                secretKeyRef:
                  name: {{ $sharedSpeechCredentialsSecret }}
                  key: {{ $.Values.sharedSpeechCredentials.secretKey | quote }}
            {{- end }}
            {{- if $vgClusterSigningKeySecret }}
            ## Public half only. api-server publishes it at
            ## /.well-known/jwks.json so linked AI clusters can verify the JWT
            ## vg-resource-resolver signs; it has no reason to hold the private
            ## key and the volume below does not mount it.
            - name: VG_CLUSTER_PUBLIC_KEY_PATH
              value: "/var/run/secrets/vg-cluster/{{ $.Values.vgCluster.signingKey.publicKeyFile }}"
            {{- end }}
          volumeMounts:
            - name: cognigy-env-reloadable
              mountPath: /config/env
              readOnly: true
            {{- with (include "vg.testHarness.apiServerCaMount" .) }}{{- . | nindent 12 }}{{- end }}
            {{- if $vgClusterSigningKeySecret }}
            - name: vg-cluster-public-key
              mountPath: /var/run/secrets/vg-cluster
              readOnly: true
            {{- end }}
          envFrom:
            - configMapRef:
                name: cognigy-env
      volumes:
        {{- with (include "vg.testHarness.apiServerCaVolume" .) }}{{- . | nindent 8 }}{{- end }}
        - name: cognigy-env-reloadable
          configMap:
            name: cognigy-env-reloadable
            items:
              - key: cognigy.yaml
                path: cognigy.yaml
        {{- if $vgClusterSigningKeySecret }}
        - name: vg-cluster-public-key
          secret:
            secretName: {{ $vgClusterSigningKeySecret | quote }}
            ## `items` is mount-time isolation, not a convenience: the Secret also
            ## holds the private signing key, and without this selector the whole
            ## Secret — private key included — would be mounted into this pod. So
            ## a compromise of api-server does not expose the signing key.
            ##
            ## It is NOT an RBAC boundary. Both halves live in one Secret, so
            ## anyone who can `get secret vg-cluster-signing-key` in this namespace
            ## reads both regardless of what is mounted where. Two Secrets bound to
            ## two ServiceAccounts would be the stronger control; this is not that.
            items:
              - key: {{ $.Values.vgCluster.signingKey.publicKeyFile | quote }}
                path: {{ $.Values.vgCluster.signingKey.publicKeyFile | quote }}
            ## 0644, intentionally looser than the resolver's 0400 on the private
            ## half: this is a PUBLIC key that this very pod serves to the internet
            ## at /.well-known/jwks.json.
            defaultMode: 420
        {{- end }}
