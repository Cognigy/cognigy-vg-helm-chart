{{- if and .Values.ingress.enabled (eq .Values.ingress.ingressClassName "traefik") }}
{{- /*
  api-server /svc/v1 is not published (ADR-001 §2.2; option F rejected). Its callers are in-cluster
  services and operators using kubectl port-forward. The api-server Ingress routes the whole host
  (`/`, Prefix), so without this route every /svc/ path reached api-server from outside the cluster.

  The match is case-insensitive because Express routes case-insensitively (/SVC/v1 reaches /svc/v1),
  and allows repeated slashes. The explicit priority beats the Ingress's `/` router, whose priority
  is its rule length. ipAllowList admits only loopback, so a client gets 403.

  The route never forwards to api-server: it ends in noop@internal (HTTP 418). The Traefik
  entrypoints accept a PROXY-protocol header from any peer (proxyProtocol.insecure), so a client can
  claim 127.0.0.1 and pass the ipAllowList; it then still reaches nothing.

  The block follows the Ingress: the same entrypoints (including an override through
  ingress.api.extraAnnotations), and with an empty ingress.api.host no Host() matcher, as the Ingress
  then serves every host. That hostless route gets priority 16, just above Traefik's default for the
  Ingress's hostless `PathPrefix(`/`)` router (its rule length, 15). So it takes /svc from api-server's
  catch-all but outranks no other application's Host() router on a shared Traefik whose hostname
  has 9 characters or more (its rule is then longer than 16).
*/}}
{{- $entrypointsKey := "traefik.ingress.kubernetes.io/router.entrypoints" }}
{{- $entrypoints := ternary "websecure" "web" .Values.tls.enabled }}
{{- with .Values.ingress.api.extraAnnotations }}
{{- $annotations := include "vg.common.tplvalues.render" (dict "value" . "context" $) | fromYaml }}
{{- if hasKey $annotations $entrypointsKey }}
{{- $entrypoints = get $annotations $entrypointsKey | toString }}
{{- end }}
{{- end }}
{{- $tlsSecret := include "vg.tlsCertificate.secretName.render" . | fromYaml }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: api-server-svc-deny
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    owner-team: echo
spec:
  ipAllowList:
    sourceRange:
      - 127.0.0.1/32
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: api-server-svc-block
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    owner-team: echo
spec:
  entryPoints:
    {{- range splitList "," $entrypoints }}
    {{- with trim . }}
    - {{ . }}
    {{- end }}
    {{- end }}
  routes:
    - match: {{ if .Values.ingress.api.host }}Host(`{{ .Values.ingress.api.host }}`) && {{ end }}PathRegexp(`(?i)^/+svc(/|$)`)
      kind: Rule
      priority: {{ ternary 10000 16 (not (empty .Values.ingress.api.host)) }}
      middlewares:
        - name: api-server-svc-deny
      services:
        - name: noop@internal
          kind: TraefikService
  {{- with $tlsSecret }}
  {{- with .tls }}
  tls:
    secretName: {{ (index . 0).secretName }}
  {{- end }}
  {{- end }}
{{- end }}
