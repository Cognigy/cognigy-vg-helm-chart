{{- if .Values.vgEventsApi.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: vg-events-api
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    app: vg-events-api
    owner-team: echo
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.vgEventsApi.port | default 4000 }}
      targetPort: {{ .Values.vgEventsApi.port | default 4000 }}
      protocol: TCP
      name: http
  selector:
    app: vg-events-api
{{- end }}
