{{- if and .Values.vgTestHarness.enabled .Values.vgTestHarness.regionDns.enabled }}
{{- /*
  DEPRECATED, superseded by the speech adapter. Retained, scaled to zero by the
  region overlay, only for a namespace that still points its own rewrites at
  these Services. See the matching deployment template for context.
*/}}
{{- range list "eu" "intl" }}
apiVersion: v1
kind: Service
metadata:
  name: mock-deepgram-{{ . }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    app: mock-deepgram-{{ . }}
    owner-team: echo
spec:
  type: ClusterIP
  selector:
    app: mock-deepgram-{{ . }}
  ports:
    - name: tls
      port: 443
      targetPort: 443
      protocol: TCP
---
{{- end }}
{{- end }}
