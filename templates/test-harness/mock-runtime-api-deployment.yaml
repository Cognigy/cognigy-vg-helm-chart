{{- if and .Values.vgTestHarness.enabled .Values.vgTestHarness.mockRuntimeApi.enabled }}
{{- /*
  mock-runtime-api stands in for vg-runtime-api, the Cognigy.AI-side service
  vg-resource-resolver asks when a call belongs to an organisation whose voice
  configuration lives in AI rather than in VG MySQL (CGY-38776).

  Off by default and gated on vgTestHarness.enabled, like the other mocks — but
  unlike them it is NOT enough to deploy it. The resolver has to be pointed at
  it via resourceResolver.runtimeApiTargets, and that is a deliberate second
  step: it changes tenancy routing namespace-wide, so it belongs in an explicit
  overlay (ci/kind/values-kind-vgai.yaml) rather than following from
  vgTestHarness.enabled.
*/}}
{{- /*
  DELIBERATELY NOT GUARDED against resourceResolver.runtimeApiTargets being
  empty, in either direction.

  Failing would be wrong: bringing this mock up on its own to check the image
  serves is a legitimate thing to do, and a render failure would forbid it.
  Warning would also be wrong, and less obviously so — Helm has no warning
  channel, so the only way to "warn" from a template is to `print` into the
  manifest stream, which corrupts the very YAML it is trying to annotate.

  The pairing is the overlay's job (ci/kind/values-kind-vgai.yaml sets both),
  and the state where it is missing is already loud where it matters: the
  resolver reports `runtime_fallback_armed 0`, and the kindvgai suite fails with
  "the resolver never asked vg-runtime-api", naming this as the cause.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-runtime-api
  namespace: {{ .Release.Namespace | quote }}
  annotations:
    "cognigy.com/source-code": "git@github.com:Cognigy/vg-test-harness.git"
  labels:
    app: mock-runtime-api
    owner-team: echo
spec:
  ## One replica, and this is load-bearing rather than a default.
  ##
  ## The suite asserts on a REQUEST COUNT — "a repeated unknown number reaches
  ## the AI side exactly once" is how the resolver's negative cache is proved —
  ## and the recorder is per-process. With two replicas the Service would spread
  ## two probes across two recorders, each would report one request, and a
  ## resolver with no negative cache at all would pass.
  replicas: 1
  selector:
    matchLabels:
      app: mock-runtime-api
  template:
    metadata:
      labels:
        app: mock-runtime-api
      annotations:
        ## The manifest is read once, at startup, so an edit only takes effect on
        ## a roll. Without this the pod keeps serving the previous organisation
        ## set after a helm upgrade changed it, and the gate exercises a mapping
        ## that no longer exists.
        checksum/organisations: {{ include (print $.Template.BasePath "/test-harness/mock-runtime-api-organisations-configmap.yaml") . | sha256sum }}
    spec:
      {{- include "image.pullSecrets" $ | nindent 6 }}
      containers:
        - name: mock-runtime-api
          image: {{ .Values.vgTestHarness.mockRuntimeApi.image }}
          imagePullPolicy: Always
          args:
            - --addr=:8080
            - --log-level={{ .Values.vgTestHarness.mockRuntimeApi.logLevel | default "info" }}
            - --organisations=/etc/vg-test-harness/organisations.json
          env:
            ## vg-feature-server decrypts the bundle's speech credentials with this
            ## same secret (ENCRYPTION_SECRET ?? JWT_SECRET, encrypt-decrypt.ts), so the
            ## mock encrypts them with it. Without it the credentials are
            ## placeholders and an AI-only call connects in silence.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: voicegateway-jwt
                  key: jwt
          volumeMounts:
            - name: organisations
              mountPath: /etc/vg-test-harness
              readOnly: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources: {{- toYaml .Values.vgTestHarness.mockRuntimeApi.resources | nindent 12 }}
      volumes:
        - name: organisations
          configMap:
            name: vg-test-harness-organisations
{{- end }}
