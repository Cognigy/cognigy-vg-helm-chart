{{/* templates/test-harness/region-dns-service.yaml */}}
{{- if include "vg.testHarness.testDnsEnabled" . }}
apiVersion: v1
kind: Service
metadata:
  name: test-dns
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app: test-dns
    owner-team: echo
spec:
  type: ClusterIP
  clusterIP: {{ include "vg.testHarness.testDnsClusterIP" . }}
  selector:
    app: test-dns
  ports:
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
{{- end }}
