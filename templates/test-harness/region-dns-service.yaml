{{/* templates/test-harness/region-dns-service.yaml */}}
{{- if and .Values.vgTestHarness.enabled .Values.vgTestHarness.regionDns.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: test-dns
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app: test-dns
    owner-team: echo
spec:
  type: ClusterIP
  clusterIP: {{ required "vgTestHarness.regionDns.clusterIP is required when vgTestHarness.regionDns.enabled is true — dnsConfig.nameservers requires a literal IP, not a hostname; choose an unused address within this cluster's Service CIDR" .Values.vgTestHarness.regionDns.clusterIP }}
  selector:
    app: test-dns
  ports:
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
{{- end }}
