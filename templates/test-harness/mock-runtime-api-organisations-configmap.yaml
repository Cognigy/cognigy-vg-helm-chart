{{- if and .Values.vgTestHarness.enabled .Values.vgTestHarness.mockRuntimeApi.enabled }}
{{- /*
  The organisation manifest: which organisations mock-runtime-api serves, i.e.
  which ones exist ONLY in the Cognigy.AI cluster.

  These numbers must NOT appear in vgTestHarness.numbers or be provisioned by
  autoProvision. A number present in BOTH stores is matched on
  vg-resource-resolver's legacy (MySQL) path and never reaches the
  legacy-miss fallback under test (CGY-38776), so the suite would pass while
  proving nothing. The guard below refuses that overlap at render time rather
  than leaving it to be discovered as a mysteriously green gate.

  Numbers are compared digits-only, so "+1 500 555 0101" and "+15005550101"
  collide. Every number feeding this guard must be a quoted string, and
  values.schema.json enforces that for all three sources (organisations[],
  numbers[], autoProvision.phoneNumber): an unquoted YAML number decodes as a
  float64, whose string form (1.5005550102e+10) would silently miss here.

  Values are camelCase by chart convention; the manifest's own keys are
  snake_case, so each field is mapped explicitly rather than dumped.
*/}}
{{- $overlapWhy := "An AI-only organisation must have no rows in VG MySQL, or vg-resource-resolver matches it on the legacy path and the CGY-38776 fallback is never exercised." }}
{{- $aiNumbers := dict }}
{{- range .Values.vgTestHarness.mockRuntimeApi.organisations }}
  {{- $name := required "every vgTestHarness.mockRuntimeApi.organisations entry needs a name" .name }}
  {{- $digits := regexReplaceAll "[^0-9]" (toString (required "every vgTestHarness.mockRuntimeApi.organisations entry needs a number" .number)) "" }}
  {{- if hasKey $aiNumbers $digits }}
  {{- fail (printf "vgTestHarness.mockRuntimeApi.organisations lists number %v twice (as %q and %q)." .number (get $aiNumbers $digits) $name) }}
  {{- end }}
  {{- $_ := set $aiNumbers $digits $name }}
{{- end }}
{{- /*
  Only the numbers the provisioner actually creates in MySQL count. In manifest
  mode (vgTestHarness.numbers set) --phone-number is not passed, and with
  autoProvision off nothing is provisioned at all.
*/}}
{{- if .Values.vgTestHarness.numbers }}
{{- range .Values.vgTestHarness.numbers }}
  {{- $digits := regexReplaceAll "[^0-9]" (toString .number) "" }}
  {{- if hasKey $aiNumbers $digits }}
  {{- fail (printf "number %v is listed in BOTH vgTestHarness.numbers and vgTestHarness.mockRuntimeApi.organisations (as %q). %s" .number (get $aiNumbers $digits) $overlapWhy) }}
  {{- end }}
{{- end }}
{{- else if .Values.vgTestHarness.autoProvision.enabled }}
{{- $phone := toString (.Values.vgTestHarness.autoProvision.phoneNumber | default "+15005550001") }}
{{- if hasKey $aiNumbers (regexReplaceAll "[^0-9]" $phone "") }}
{{- fail (printf "vgTestHarness.autoProvision.phoneNumber %s is also listed in vgTestHarness.mockRuntimeApi.organisations (as %q). %s" $phone (get $aiNumbers (regexReplaceAll "[^0-9]" $phone "")) $overlapWhy) }}
{{- end }}
{{- end }}
{{- $entries := list }}
{{- range .Values.vgTestHarness.mockRuntimeApi.organisations }}
  {{- $entry := dict "name" .name "number" .number }}
  {{- with .organisationId }}{{- $_ := set $entry "organisation_id" . }}{{- end }}
  {{- with .projectId }}{{- $_ := set $entry "project_id" . }}{{- end }}
  {{- with .endpointId }}{{- $_ := set $entry "endpoint_id" . }}{{- end }}
  {{- with .webhookUrl }}{{- $_ := set $entry "webhook_url" . }}{{- end }}
  {{- with .applicationSid }}{{- $_ := set $entry "application_sid" . }}{{- end }}
  {{- $entries = append $entries $entry }}
{{- end }}
{{- /*
  carrier_gateways: vg-resource-resolver serves a fallback bundle only if one of
  its carrier's inbound gateways accepts the call's source. The AI-only
  organisations sit behind the same shared trunk as the VG-side test carrier, so
  they get the same source range autoProvision gives that carrier. Without it
  every bundle is source_unverifiable and the headline kindvgai call stays 480.
  Needs a mock-runtime-api image that knows the key (vg-test-harness PR 152):
  the manifest decoder refuses unknown fields.
*/}}
{{- $defaults := dict "webhook_url" (include "vg.testHarness.webhookUrl" $) }}
{{- with .Values.vgTestHarness.autoProvision.carrierSourceIPv4 }}
{{- $_ := set $defaults "carrier_gateways" (list (dict "ipv4" . "netmask" (int ($.Values.vgTestHarness.autoProvision.carrierSourceNetmask | default 32)))) }}
{{- end }}
{{- $manifest := dict "version" 1 "defaults" $defaults "organisations" $entries }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: vg-test-harness-organisations
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app: mock-runtime-api
    owner-team: echo
  annotations:
    "cognigy.com/source-code": "git@github.com:Cognigy/vg-test-harness.git"
data:
  organisations.json: |
    {{- toPrettyJson $manifest | nindent 4 }}
{{- end }}
