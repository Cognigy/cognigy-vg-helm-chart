{{- if and .Values.vgTestHarness.enabled .Values.vgTestHarness.mockRuntimeApi.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: mock-runtime-api
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app: mock-runtime-api
    owner-team: echo
spec:
  type: ClusterIP
  selector:
    app: mock-runtime-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
{{- end }}
