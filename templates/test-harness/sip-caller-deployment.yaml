{{- if .Values.vgTestHarness.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sip-caller
  namespace: {{ .Release.Namespace | quote }}
  annotations:
    "cognigy.com/source-code": "git@github.com:Cognigy/vg-test-harness.git"
  labels:
    app: sip-caller
    owner-team: echo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sip-caller
  template:
    metadata:
      labels:
        app: sip-caller
    spec:
      {{- include "image.pullSecrets" $ | nindent 6 }}
      {{- /*
        Optional scheduling controls. Needed because sbc-sip runs with
        hostNetwork: when sip-caller sits on a different node, its INVITE is
        SNAT'd and arrives with the node address as its source instead of the
        pod IP. The carrier allow-list then has to cover two unrelated ranges,
        and which one applies varies run to run. Co-locating sip-caller with
        sbc-sip keeps the source address deterministically a pod IP.
      */}}
      {{- if .Values.vgTestHarness.sipCaller.affinity }}
      affinity: {{- include "vg.common.tplvalues.render" (dict "value" .Values.vgTestHarness.sipCaller.affinity "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.vgTestHarness.sipCaller.nodeSelector }}
      nodeSelector: {{- include "vg.common.tplvalues.render" (dict "value" .Values.vgTestHarness.sipCaller.nodeSelector "context" $) | nindent 8 }}
      {{- end }}
      containers:
        - name: sip-caller
          image: {{ .Values.vgTestHarness.sipCaller.image }}
          imagePullPolicy: Always
          args:
            - --addr=:8090
            - --sbc-host={{ .Values.sbc.sip.headlessServiceName | default "sbc-sip-headless" }}
            - --sbc-port=5060
            # Mock-SRS SIPREC activation behavior (CGY-35021): answer the
            # initial INVITE with a=inactive/c=0.0.0.0, then fire a delayed
            # a=recvonly re-INVITE — reproducing the recorder-not-ready-yet
            # pattern the re-offer media-activation fix targets. Always on to
            # ensure test-harness environments exercise this behavior.
            - --mock-srs-initial-inactive
            - --mock-srs-auto-activate
            {{- range .Values.vgTestHarness.sipCaller.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 10
          resources: {{- toYaml .Values.vgTestHarness.sipCaller.resources | nindent 12 }}
{{- end }}
