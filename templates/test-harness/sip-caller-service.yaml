{{- if .Values.vgTestHarness.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: sip-caller
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app: sip-caller
    owner-team: echo
spec:
  type: ClusterIP
  selector:
    app: sip-caller
  ports:
    - name: http
      port: 8090
      targetPort: 8090
      protocol: TCP
    # mock-agent TLS listener (--mock-agent-tls-port). Required by the
    # avaya-srtp-mock outbound carrier: the trunk dials sip-caller:5071 over
    # tls/srtp, and the provisioner's avayaSrtpMockTLSPort must match. Service
    # DNS, not a pod IP — a reschedule must not stale it.
    #
    # Without this the dial has nowhere to land: the mock-agent is listening
    # inside the pod (it ships in the sip-caller binary, on by default) but
    # unreachable, so TestAvayaSRTPCryptoReInvite and friends time out with
    # CallsTotal: 0 and nothing naming the cause.
    - name: sip-agent-tls
      port: 5071
      targetPort: 5071
      protocol: TCP
    # mock-agent plain UDP listener (--mock-agent-port, default 5070). Required
    # by the mock-agent-udp outbound carrier, which createCall and the dial
    # command use in kindsmoke: that suite runs without drachtio TLS, so the
    # tls/srtp avaya-srtp-mock trunk is not available there. The provisioner's
    # mockAgentUDPPort must match.
    - name: sip-agent-udp
      port: 5070
      targetPort: 5070
      protocol: UDP
    - name: sip-srs
      port: 5072
      targetPort: 5072
      protocol: UDP
{{- end }}
