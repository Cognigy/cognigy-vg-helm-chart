{{- if .Values.vgTestHarness.enabled }}
{{- $tlsEnabled := dig "tls" "enabled" false .Values.vgTestHarness.mockSpeech }}
apiVersion: v1
kind: Service
metadata:
  name: mock-speech
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app: mock-speech
    owner-team: echo
spec:
  type: ClusterIP
  selector:
    app: mock-speech
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    {{- if $tlsEnabled }}
    - name: https
      port: 443
      targetPort: 8443
      protocol: TCP
    {{- end }}
{{- end }}
