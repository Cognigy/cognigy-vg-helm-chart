{{/* templates/test-harness/region-dns-configmap.yaml */}}
{{- if include "vg.testHarness.testDnsEnabled" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: test-dns-corefile
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app: test-dns
    owner-team: echo
{{- /*
  The vendor route ships its own hostname list (vg.testHarness.vendorRewrites)
  so no caller has to restate it; regionDns.rewrites is appended, never
  replaced, so an install can still add one.
*/}}
{{- $rewrites := .Values.vgTestHarness.regionDns.rewrites }}
{{- if include "vg.testHarness.vendorRoute" . }}
{{- $rewrites = concat (include "vg.testHarness.vendorRewrites" . | fromYamlArray) $rewrites }}
{{- end }}
data:
  Corefile: |
    . {
        {{- range $rewrites }}
        {{- if eq (.type | default "exact") "regex" }}
        {{- /*
          answer auto is required here and NOT on the exact form: a regex rewrite
          can produce an answer whose owner name does not match the question a
          strict resolver asked, and Node's TLS/SNI path is strict enough to care.
        */}}
        rewrite name regex {{ .name }} {{ .target }}.{{ $.Release.Namespace }}.svc.cluster.local. answer auto
        {{- else }}
        rewrite name exact {{ .name }}. {{ .target }}.{{ $.Release.Namespace }}.svc.cluster.local.
        {{- end }}
        {{- end }}
        forward . {{ .Values.vgTestHarness.regionDns.upstream }}
        log
        errors
    }
{{- end }}
