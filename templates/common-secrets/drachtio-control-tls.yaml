{{- if include "vg.drachtioControlTls.mounted" . }}
{{- /*
  Certificates of the drachtio control hop (CGY-46071, docs/017-drachtio-control-tls.md), signed once
  and reused (vg.drachtioControlTls.material). Same idiom as templates/redis/redis-ha-tls-secret.yaml.

  resource-policy keep: an uninstall, a rollback or turning the hop off leaves them in place, so
  turning it on again reuses the CA instead of rolling every pod. Deleting one by hand rotates it.
*/}}
{{- $m := include "vg.drachtioControlTls.material" . | fromJson }}
{{- $sn := .Values.drachtioControlTls.secretName }}
{{- /* The CA with its key, to sign certificates on later renders. Mounted nowhere. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-ca" $sn }}
  namespace: {{ .Release.Namespace | quote }}
  annotations:
    "helm.sh/resource-policy": keep
  labels:
    owner-team: echo
type: Opaque
data:
  ca.crt: {{ get $m "ca.crt" }}
  ca.key: {{ get $m "ca.key" }}
{{- range $server, $key := include "vg.drachtioControlTls.servers" . | fromJson }}
---
{{- /* Server certificate of sbc-inbound / sbc-outbound; ca.crt checks drachtio's client certificate. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-%s" $sn $server }}
  namespace: {{ $.Release.Namespace | quote }}
  annotations:
    "helm.sh/resource-policy": keep
    {{- /* The DNS names the certificate was signed for; a change signs it anew (vg.drachtioControlTls.material). */}}
    "cognigy.com/dns-names-sha256": {{ get $m (printf "%s.dns-names-sha256" $server) | quote }}
  labels:
    app: {{ $server }}
    owner-team: echo
type: kubernetes.io/tls
data:
  tls.crt: {{ get $m (printf "%s.crt" $server) }}
  tls.key: {{ get $m (printf "%s.key" $server) }}
  ca.crt: {{ get $m "ca.crt" }}
{{- end }}
---
{{- /* Client certificate of drachtio in sbc-sip; ca.crt verifies sbc-inbound and sbc-outbound. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-client-sbc-sip" $sn }}
  namespace: {{ .Release.Namespace | quote }}
  annotations:
    "helm.sh/resource-policy": keep
  labels:
    app: sbc-sip
    owner-team: echo
type: kubernetes.io/tls
data:
  tls.crt: {{ get $m "client.crt" }}
  tls.key: {{ get $m "client.key" }}
  ca.crt: {{ get $m "ca.crt" }}
{{- end }}
