{{- if .Values.serviceAuth.keys.autoGenerate }}
{{- $hookPullSecret := "vg-service-keys-generator-pull" }}
{{- $ownPullSecret := and .Values.imageCredentials.registry .Values.imageCredentials.username .Values.imageCredentials.password }}
{{- $secretNames := list }}
{{- range include "vg.serviceAuth.keyNames" . | fromYamlArray }}
{{- $secretNames = append $secretNames (include "vg.serviceAuth.secretName" .) }}
{{- end }}
{{- $image := .Values.serviceAuth.keys.generatorImage | default .Values.vgCluster.signingKey.generatorImage }}
# Generates the per-service ES256 signing keys of signed service-to-service auth (ADR-001 §2.4,
# CGY-43682), one Secret per key (templates/_service-auth.tpl lists them).
#
# Separate from vg-cluster-signing-key-job.yaml on purpose: that template renders nothing when
# vgCluster.signingKey.existingSecret is set, and the service keys must exist on every cluster.
#
# NEVER OVERWRITES. A Secret that exists is left alone; a slot listed in
# serviceAuth.keys.<name>.slots that is missing from it is added (rotation, CGY-43688), and a slot
# that exists is never touched. The Role has no update or delete verb, and every add is a JSON patch
# guarded by a `test` on the resourceVersion read before the slot was found missing, so a concurrent
# writer makes the patch fail instead of being overwritten. Retiring a slot is a manual step of the
# rotation runbook; this Job never removes anything.
#
# The Secrets are created by kubectl, not Helm, so Helm never owns them and `helm uninstall` keeps
# them, like the cluster signing key.
{{- if $ownPullSecret }}
---
# The Job's own copy of the registry pull secret: on a fresh install `cognigy-registry-token` is
# applied only after every pre-install hook has run (see vg-cluster-signing-key-job.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: {{ $hookPullSecret }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    owner-team: echo
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded"
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ template "imagePullSecret" . }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vg-service-keys-generator
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    owner-team: echo
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vg-service-keys-generator
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    owner-team: echo
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded"
rules:
  # `create` cannot be restricted by resourceNames (the create URL carries no name).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  # `patch` only adds a missing slot (see the script). No update or delete.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: {{ $secretNames | toJson }}
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vg-service-keys-generator
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    owner-team: echo
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded"
subjects:
  - kind: ServiceAccount
    name: vg-service-keys-generator
    namespace: {{ $.Release.Namespace | quote }}
roleRef:
  kind: Role
  name: vg-service-keys-generator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: vg-service-keys-generator
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    owner-team: echo
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    ## After the RBAC above (-10), before the workloads that mount the Secrets.
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      name: vg-service-keys-generator
      labels:
        owner-team: echo
    spec:
      restartPolicy: OnFailure
      serviceAccountName: vg-service-keys-generator
      priorityClassName: {{ include "vg.priorityClassName" (dict "name" .Values.jobs.hookPriorityClassName "context" $) }}
      {{- if $ownPullSecret }}
      imagePullSecrets:
        - name: {{ $hookPullSecret }}
      {{- else if $.Values.imageCredentials.pullSecrets }}
      imagePullSecrets:
        {{- range $.Values.imageCredentials.pullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: generate
          image: {{ include "vg.common.image.render" (dict "global" $.Values.global "image" $image) }}
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              NAMESPACE={{ $.Release.Namespace | quote }}
              WORK=$(mktemp -d)
              trap 'rm -rf "$WORK"' EXIT
              umask 077
              ## Records the provider for the FIPS evidence; never prints key material.
              openssl version
              openssl list -providers 2>/dev/null || true

              # P-256, PKCS #8 private (BEGIN PRIVATE KEY) and SPKI public: what loadSigningKey and
              # createPemKeySource in @cognigy-internal/vg-service-auth read.
              gen() {
                openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out "$WORK/key-$1.pem"
                openssl pkey -in "$WORK/key-$1.pem" -pubout -out "$WORK/key-$1.pub.pem"
              }
              b64() { base64 < "$1" | tr -d '\n'; }

              # ensure_key <secret> <slot>...: create the Secret with the slots, or add the missing ones.
              # Every read is a plain assignment on its own line, so a failed read stops the script (set -e)
              # and the Job retries. Inside `[ -n "$(kubectl ...)" ]` or `local x=$(...)` the exit status
              # is lost, and an empty result would read as "slot missing" or "no data": the patch would
              # then replace the slot or reset /data.
              ensure_key() {
                local secret=$1 slot rv priv pub data
                shift
                if ! kubectl get secret "$secret" -n "$NAMESPACE" >/dev/null 2>&1; then
                  local args=()
                  for slot in "$@"; do
                    gen "$slot"
                    args+=(--from-file="key-$slot.pem=$WORK/key-$slot.pem" --from-file="key-$slot.pub.pem=$WORK/key-$slot.pub.pem")
                  done
                  # Fails if another writer created it meanwhile; the Job retries and finds it.
                  kubectl create secret generic "$secret" -n "$NAMESPACE" "${args[@]}"
                  kubectl label secret "$secret" -n "$NAMESPACE" owner-team=echo >/dev/null 2>&1 || true
                  echo "OK: created $secret with slot(s) $*."
                  return
                fi
                for slot in "$@"; do
                  # resourceVersion first, then the check: the patch below only applies to this version.
                  rv=$(kubectl get secret "$secret" -n "$NAMESPACE" -o jsonpath='{.metadata.resourceVersion}')
                  priv=$(kubectl get secret "$secret" -n "$NAMESPACE" -o jsonpath="{.data.key-$slot\.pem}")
                  pub=$(kubectl get secret "$secret" -n "$NAMESPACE" -o jsonpath="{.data.key-$slot\.pub\.pem}")
                  if [ -n "$priv" ] && [ -n "$pub" ]; then
                    echo "OK: $secret slot $slot exists, left untouched."
                    continue
                  fi
                  # Half a pair cannot be completed without replacing the other half: stop for a human.
                  if [ -n "$priv$pub" ]; then
                    echo "ERROR: $secret slot $slot has only one of key-$slot.pem and key-$slot.pub.pem; fix it by hand (vg-resources docs/operations/sops/rotate-vg-service-signing-key.md)." >&2
                    exit 1
                  fi
                  data=$(kubectl get secret "$secret" -n "$NAMESPACE" -o jsonpath='{.data}')
                  gen "$slot"
                  local data_op=""
                  if [ -z "$data" ]; then
                    data_op='{"op":"add","path":"/data","value":{}},'
                  fi
                  printf '[{"op":"test","path":"/metadata/resourceVersion","value":"%s"},%s{"op":"add","path":"/data/key-%s.pem","value":"%s"},{"op":"add","path":"/data/key-%s.pub.pem","value":"%s"}]' \
                    "$rv" "$data_op" "$slot" "$(b64 "$WORK/key-$slot.pem")" "$slot" "$(b64 "$WORK/key-$slot.pub.pem")" > "$WORK/patch.json"
                  kubectl patch secret "$secret" -n "$NAMESPACE" --type=json --patch-file "$WORK/patch.json" >/dev/null
                  rm -f "$WORK/patch.json"
                  echo "OK: added slot $slot to $secret."
                done
              }

              {{- range include "vg.serviceAuth.keyNames" . | fromYamlArray }}
              ensure_key {{ include "vg.serviceAuth.secretName" . }} {{ (include "vg.serviceAuth.keyConfig" (dict "name" . "root" $) | fromYaml).slots | join " " }}
              {{- end }}
          resources:
            requests:
              cpu: "50m"
              memory: 64Mi
            limits:
              cpu: "200m"
              memory: 128Mi
{{- end }}
