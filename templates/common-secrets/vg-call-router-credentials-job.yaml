{{- if .Values.serviceAuth.callRouter.autoGenerate }}
{{- $secret := include "vg.callRouterAuth.secretName" . }}
{{- $hookPullSecret := "vg-call-router-credentials-generator-pull" }}
{{- $ownPullSecret := and .Values.imageCredentials.registry .Values.imageCredentials.username .Values.imageCredentials.password }}
{{- $image := .Values.serviceAuth.keys.generatorImage | default .Values.vgCluster.signingKey.generatorImage }}
# Creates the basic-auth credential drachtio (sbc-sip) sends to sbc-call-router (ADR-001 §2.8,
# CGY-43876): Secret vg-call-router-credentials, key `credentials` = drachtio:<64 hex characters>. Hex
# keeps it URL-safe, because it goes into drachtio's request-handler URL as userinfo. A hook, so the
# Secret exists before sbc-sip and sbc-call-router start on a fresh install.
#
# NEVER OVERWRITES. An existing Secret is left alone; the Role can create Secrets and read only this one,
# with no update, patch or delete. Same pattern as vg-service-keys-job.yaml: created by kubectl, not
# Helm, so `helm uninstall` keeps it. Nothing the Job prints contains the credential.
{{- if $ownPullSecret }}
---
# The Job's own copy of the registry pull secret: on a fresh install `cognigy-registry-token` is
# applied only after every pre-install hook has run (see vg-cluster-signing-key-job.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: {{ $hookPullSecret }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    owner-team: echo
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded"
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ template "imagePullSecret" . }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vg-call-router-credentials-generator
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    owner-team: echo
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vg-call-router-credentials-generator
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    owner-team: echo
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded"
rules:
  # `create` cannot be restricted by resourceNames (the create URL carries no name).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $secret | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vg-call-router-credentials-generator
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    owner-team: echo
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded"
subjects:
  - kind: ServiceAccount
    name: vg-call-router-credentials-generator
    namespace: {{ $.Release.Namespace | quote }}
roleRef:
  kind: Role
  name: vg-call-router-credentials-generator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: vg-call-router-credentials-generator
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    owner-team: echo
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    ## After the RBAC above (-10), before the workloads that mount the Secret.
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      name: vg-call-router-credentials-generator
      labels:
        owner-team: echo
    spec:
      restartPolicy: OnFailure
      serviceAccountName: vg-call-router-credentials-generator
      priorityClassName: {{ include "vg.priorityClassName" (dict "name" .Values.jobs.hookPriorityClassName "context" $) }}
      {{- if $ownPullSecret }}
      imagePullSecrets:
        - name: {{ $hookPullSecret }}
      {{- else if $.Values.imageCredentials.pullSecrets }}
      imagePullSecrets:
        {{- range $.Values.imageCredentials.pullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: generate
          image: {{ include "vg.common.image.render" (dict "global" $.Values.global "image" $image) }}
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              # The credential pattern matches ASCII only, whatever locale the image sets (the init
              # container does the same).
              export LC_ALL=C
              NAMESPACE={{ $.Release.Namespace | quote }}
              SECRET={{ $secret | quote }}
              # The provider openssl runs with; under FedRAMP it must be the FIPS one.
              openssl version
              openssl list -providers 2>/dev/null || true
              if kubectl get secret "$SECRET" -n "$NAMESPACE" >/dev/null 2>&1; then
                # Never changed, but a hand-made value that drachtio cannot carry fails the upgrade here
                # instead of every sbc-sip pod. Same whole-value check as the init container; $(...) drops
                # trailing newlines there too. The value is never printed.
                if ! encoded=$(kubectl get secret "$SECRET" -n "$NAMESPACE" -o jsonpath='{.data.credentials}'); then
                  echo "ERROR: cannot read $SECRET" >&2
                  exit 1
                fi
                if [ -z "$encoded" ]; then
                  echo "ERROR: $SECRET has no key credentials (or it is empty)" >&2
                  exit 1
                fi
                # $(...) would drop a NUL byte silently, while sbc-call-router reads the raw file.
                if [ "$(printf '%s' "$encoded" | base64 -d | tr -d '\000' | wc -c)" -ne "$(printf '%s' "$encoded" | base64 -d | wc -c)" ]; then
                  echo "ERROR: $SECRET key credentials contains a NUL byte (value not printed)" >&2
                  exit 1
                fi
                value=$(printf '%s' "$encoded" | base64 -d)
                pattern='{{ include "vg.callRouterAuth.credentialPattern" . }}'
                if ! [[ $value =~ $pattern ]]; then
                  echo "ERROR: $SECRET key credentials is not user:password in letters, digits and ._~- (value not printed)" >&2
                  exit 1
                fi
                echo "OK: $SECRET exists, left untouched."
                exit 0
              fi
              WORK=$(mktemp -d)
              trap 'rm -rf "$WORK"' EXIT
              umask 077
              # A bare assignment, so set -e stops the Job if openssl fails.
              password=$(openssl rand -hex 32)
              [ "${#password}" -eq 64 ]
              printf 'drachtio:%s' "$password" > "$WORK/credentials"
              # Fails if another writer created it meanwhile; the Job retries and finds it.
              # Labelled before it is created: the Role may create Secrets but not patch them.
              kubectl create secret generic "$SECRET" -n "$NAMESPACE" --from-file=credentials="$WORK/credentials" --dry-run=client -o yaml |
                kubectl label --local -f - owner-team=echo -o yaml |
                kubectl create -f - >/dev/null || { echo "ERROR: cannot create $SECRET (the Job retries)" >&2; exit 1; }
              echo "OK: created $SECRET."
          resources:
            requests:
              cpu: "50m"
              memory: 64Mi
            limits:
              cpu: "200m"
              memory: 128Mi
{{- end }}
