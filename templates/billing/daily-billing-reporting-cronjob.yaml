{{- /* Deploy the daily-billing-reporting-v1 CronJob when billing and sendToCentral are enabled */ -}}
{{- /* Parenthesised so an explicit `sendToCentral: null` or `privateKeySecret: null` doesn't crash the render. */ -}}
{{- $vgBillingSigningKeySecret := ((.Values.billing.sendToCentral).privateKeySecret).existingSecret }}
{{- $vgBillingSigningKeySecretKey := ((.Values.billing.sendToCentral).privateKeySecret).secretKey }}
{{ if and .Values.billing.enabled .Values.billing.sendToCentral.enabled .Values.billing.sendToCentral.serverUrl }}
{{- /* Only a non-empty privateKeyPath fails: "" (the old default) and null meant unset. */ -}}
{{- if .Values.billing.sendToCentral.privateKeyPath }}
{{- fail "billing.sendToCentral.privateKeyPath was removed; use billing.sendToCentral.privateKeySecret.{existingSecret,secretKey} instead" }}
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vg-daily-billing-reporting
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app: vg-billing
    component: daily-billing-reporting
    owner-team: echo
  annotations:
    "cognigy.com/source-code": "git@github.com:Cognigy/vg-api-server.git"
spec:
  schedule: {{ .Values.billing.sendToCentral.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.billing.job.backoffLimit }}
      ttlSecondsAfterFinished: {{ .Values.billing.job.ttlSecondsAfterFinished }}
      template:
        metadata:
          labels:
            app: vg-billing
            component: daily-billing-reporting
          annotations:
            sidecar.istio.io/inject: "false"
        spec:
          {{- include "image.pullSecrets" $ | nindent 10 }}
          restartPolicy: {{ .Values.billing.job.restartPolicy }}
          {{- $jobScheduling := dict "job" .Values.billing.sendToCentral "context" $ }}
          {{- if $vgBillingSigningKeySecret }}
          {{- /* The non-root "node" user (gid 1000) reads the 0400 key through fsGroup, merged into
             podSecurityContext unless it already sets one (like vg-audio-manager). */}}
          {{- $podSecurityContext := fromYaml (include "vg.common.tplvalues.render" (dict "value" (.Values.billing.job.podSecurityContext | default dict) "context" $)) | default dict }}
          {{- if not $podSecurityContext.fsGroup }}
          {{- $_ := set $podSecurityContext "fsGroup" 1000 }}
          {{- end }}
          {{- $_ := set $jobScheduling "podSecurityContext" $podSecurityContext }}
          {{- end }}
          {{- include "vg.billing.jobScheduling" $jobScheduling | trim | nindent 10 }}
          containers:
            - name: daily-billing-reporting
              image: {{ include "vg.common.image.render" (dict "global" $.Values.global "image" .Values.api.image) }}
              imagePullPolicy: {{ .Values.api.imagePullPolicy | default "IfNotPresent" }}
              command: ["node", "build/lib/billing/jobs/daily-billing-reporting-v1/index.js"]
              env:
                - name: JAMBONES_MYSQL_HOST
                  value: {{ .Values.mysql.host | quote }}
                - name: JAMBONES_MYSQL_PORT
                  value: {{ .Values.mysql.port | default "3306" | quote }}
                - name: JAMBONES_MYSQL_DATABASE
                  value: {{ .Values.mysql.database.name | quote }}
                - name: JAMBONES_MYSQL_USER
                  value: {{ .Values.billing.mysql.username | quote }}
                - name: JAMBONES_MYSQL_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.billing.mysql.existingSecret | quote }}
                      key: {{ .Values.billing.mysql.secretKey | quote }}
                - name: VG_SPEECH_BILLING_MYSQL_HOST
                  value: {{ .Values.mysql.host | quote }}
                - name: VG_SPEECH_BILLING_MYSQL_PORT
                  value: {{ .Values.mysql.port | default "3306" | quote }}
                - name: VG_SPEECH_BILLING_MYSQL_DATABASE
                  value: {{ .Values.billing.mysql.database | quote }}
                - name: VG_SPEECH_BILLING_MYSQL_USER
                  value: {{ .Values.billing.mysql.username | quote }}
                - name: VG_SPEECH_BILLING_MYSQL_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.billing.mysql.existingSecret | quote }}
                      key: {{ .Values.billing.mysql.secretKey | quote }}
                - name: VG_SPEECH_BILLING_SERVER_URL
                  value: {{ .Values.billing.sendToCentral.serverUrl | quote }}
                {{- if $vgBillingSigningKeySecret }}
                - name: BILLING_VG_PRIVATE_KEY_PATH
                  value: "/var/run/secrets/vg-billing/billing-signing-key.pem"
                {{- end }}
                {{- with include "vg.fedramp.requireExplicitEncryptionKeys" $ }}
                - name: REQUIRE_EXPLICIT_ENCRYPTION_KEYS
                  value: {{ . | quote }}
                {{- end }}
                - name: VG_SPEECH_BILLING_REPORTING_LAG_DAYS
                  value: {{ .Values.billing.sendToCentral.reportingLagDays | quote }}
                {{- /* Reloadable configs were introduced in v2026.17.0; once this service reads COGNIGY_AI_VERSION from the mounted ConfigMap, this fallback can be removed in a future release. */}}
                {{- if not .Values.global.reloadableConfig.enabled }}
                - name: COGNIGY_AI_VERSION
                  value: {{ regexFind "^[0-9]+\\.[0-9]+\\.[0-9]+" .Chart.Version | quote }}
                {{- end }}
                - name: JAMBONES_LOGLEVEL
                  value: {{ if .Values.billing.logLevel }}{{ .Values.billing.logLevel | quote }}{{ else }}{{ .Values.global.logLevel | quote }}{{ end }}
              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
              volumeMounts:
                - name: cognigy-env-reloadable
                  mountPath: /config/env
                  readOnly: true
                {{- if $vgBillingSigningKeySecret }}
                - name: billing-signing-key
                  mountPath: /var/run/secrets/vg-billing
                  readOnly: true
                {{- end }}
          volumes:
            - name: cognigy-env-reloadable
              configMap:
                name: cognigy-env-reloadable
                items:
                  - key: cognigy.yaml
                    path: cognigy.yaml
            {{- if $vgBillingSigningKeySecret }}
            - name: billing-signing-key
              secret:
                secretName: {{ $vgBillingSigningKeySecret | quote }}
                ## Only the key, under a fixed name. 0400 + fsGroup, like the cluster signing key.
                items:
                  - key: {{ required "billing.sendToCentral.privateKeySecret.secretKey is required when existingSecret is set" $vgBillingSigningKeySecretKey | quote }}
                    path: billing-signing-key.pem
                defaultMode: 256
            {{- end }}
{{- end }}
