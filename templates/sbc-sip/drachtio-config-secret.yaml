{{- /*
drachtio.conf.xml template (ADR-001 §2.8, CGY-43876). A Secret, not a ConfigMap, because the file drachtio
reads carries the sbc-call-router credential: the init container in sbc-sip (vg.callRouterAuth.drachtioInitContainer)
replaces __CALL_ROUTER_USERINFO__ with `drachtio:<credential>@` from Secret vg-call-router-credentials. The
credential itself is never rendered by Helm.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: sbc-sip-drachtio-config
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    owner-team: echo
type: Opaque
stringData:
  drachtio.conf.xml: |
    <drachtio>

        <!-- udp port to listen on for client connections and shared secret used to authenticate clients -->
        <admin port="9022" secret="cymru">0.0.0.0</admin>
        <request-handlers>
          {{- if include "vg.fedramp.callRouterTls" . }}
          {{- /* HTTPS only, against the chart's CA (docs/016-call-router-tls.md); verify-peer is drachtio's default. */}}
          <request-handler sip-method="INVITE" http-method="POST" ca-file="{{ include "vg.callRouterTls.mountPath" . }}/ca.crt">https://__CALL_ROUTER_USERINFO__sbc-call-router:{{ .Values.sbcCallRouter.port }}</request-handler>
          {{- else }}
          <request-handler sip-method="INVITE" http-method="POST">http://__CALL_ROUTER_USERINFO__sbc-call-router:{{ .Values.sbcCallRouter.port }}</request-handler>
          {{- end }}
        </request-handlers>
        <sip>
          <udp-mtu>4096</udp-mtu>
        </sip>

        <cdrs>false</cdrs>

        <logging>
            <sofia-loglevel>3</sofia-loglevel>
            <loglevel>info</loglevel>
        </logging>

    </drachtio>
